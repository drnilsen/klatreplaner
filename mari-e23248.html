html{-webkit-text-size-adjust:100%}

.grid .h{color:var(--muted);text-align:center;font-weight:600}

a{color:var(--accent)}

.muted{color:var(--muted)}
.small{font-size:13.5px}

.ok{color:var(--accent)}

.tbtn{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;min-height:38px;font-weight:700}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:15px}
.chk input{width:20px;height:20px}
.exlist .ex{grid-template-columns:118px minmax(0,1fr);gap:12px}
@media (min-width:560px){.exlist .ex{grid-template-columns:200px minmax(0,1fr)}}
.grid.g6{grid-template-columns:52px repeat(5,1fr)}
.vid{font-size:12.5px;font-weight:500;white-space:nowrap;margin-left:4px}
@media (min-width:640px){ .brand h1{font-size:20px} h2{font-size:26px} }

function setsOf(txt,light){ if(!light) return txt; return txt.replace(/^(\d+) ×/,(m,n)=>`${Math.min(2,+n)} ×`); }
function exRow(code,name,txt,dose,pause,fig,tag){
  return `<div class="ex"><div class="fig" role="img" aria-label="${name}">${FIG[fig]||""}</div><div>
   <div class="exh"><span><span class="code">${code}</span>${name}${vid(name)}</span><span class="sets">${dose}</span></div>
   ${tag?`<div class="meta"><span class="tag warn">${tag}</span></div>`:""}<p>${txt}${pause?` · Pause ${pause}`:""}</p></div></div>`;
}
function strAHtml(i){
  const col=i.S-1;
  if(i.comp) return `<div class="blk"><h4>Konkurranseuke<span class="dur">30 min</span></h4><ul><li>Oppvarming, A1/A2 2 sett, 20 min mobilitet.</li></ul></div>
    <div class="exlist">${STYRKE_A.slice(0,2).map(e=>exRow(e[0],e[1],e[2],setsOf(e[3][0],true),e[4],e[5],"")).join("")}</div>`;
  const note=(i.y===2026&&i.w<=46)?"Uke 45–46: uten eller med lett vekt – lær øvelsene.":(i.y===2026&&i.w===47)?"Uke 47: vekt på.":([11,13,15].includes(i.w)&&i.y===2027)?"Tyngre kettlebell denne uka (maks +4 kg, tak 16–20 kg).":"";
  return `<div class="blk"><h4>Hoveddel</h4><ul><li>RPE 7: lav rep, hver rep rask og presis. Supersett A1/A2 osv. Aldri til svikt – stopp settet idet farten faller.${i.light?" Lett uke: 2 sett.":""}</li>${note?`<li><b>${note}</b></li>`:""}</ul></div>
   <div class="exlist">${STYRKE_A.map(e=>exRow(e[0],e[1],e[2],setsOf(e[3][col],i.light),e[4],e[5],"")).join("")}</div>
   <div class="blk"><ul><li>Avslutt med 10 min mobilitet.</li><li><b>Progresjon:</b> teknikk → vekt → vanskeligere variant. Bare i uker uten annen ny ting.</li></ul></div>`;
}
function strBHtml(i){
  const rows=[];
  const camp=CAMPUS.has(i.w)&&i.y===2027&&!i.light;
  if(camp) rows.push([STYRKE_B.C,"3 × 2 stiger",i.w===6?"Første gang – føtter på":""]);
  const early=i.phase==="f1"||(i.y===2027&&i.w===2);
  rows.push([STYRKE_B.A,early?"4 × 3":"3 × 3",early?"Strikk om nødvendig":""]);
  const onlyAD=i.phase==="f3"&&i.odd;
  if(!onlyAD) rows.push(early?[STYRKE_B.B0,"3 × 4–5",""]:[STYRKE_B.B,"3 × 3",(i.y===2027&&i.w===3)?"Ny denne uka":""]);
  rows.push([STYRKE_B.D,"2 × 5",""]);
  return `<div class="blk"><h4>Styrke B · eksplosiv drastyrke<span class="dur">${camp?"60":"50"} min</span></h4><ul>
    <li>Oppvarming 20 min: 5 min puls · mobilitet 8 min · scapula pull-ups 2 × 6 · strikk utadrotasjon 2 × 12 · 3 lette heng · 2 × 3 kjedeflytt på stang (svikt – skyv – trekk, sakte).</li>
    ${onlyAD?"<li>Konkurranseformat-lørdag: bare A og D.</li>":""}<li>Progresjon: først fart/høyde, så vekt, så campus. Aldri flere reps. Stopp: én rep uten «smell».</li></ul></div>
    <div class="exlist">${rows.map(([e,dose,tag])=>exRow(e[0],e[1],e[2],i.light?setsOf(dose,true):dose,e[3],e[4],tag)).join("")}</div>`;
}

/* Mobilitet */
const MOB=[
 ["Dyp knebøy-hold","deep_squat","Føtter skulderbredde, hæler nede (ev. tynn plate), albuene presser knærne ut, ryggen lang. 3 × 30–60 s.","Høyt steg uten armtrekk: foten i hoftehøyde på lett buldre, reis deg uten å trekke. 5 per side."],
 ["90/90 hofterotasjon","ninety","Sitt på gulvet med begge knær bøyd 90°: fremre legg på tvers foran deg, bakre legg ut til siden bak deg. Overkroppen oppreist. Vipp begge knærne over til motsatt side uten å støtte med hendene – da bytter beina rolle. 10 bytter, hold 20 s i hver ytterstilling.","Dropknee på lett vegg: store tak, hvert flytt med dropknee, 2 s hold. 6–8 flytt."],
 ["Due","pigeon","Fremre legg på tvers, bakre bein strakt, hofta rett fram. 60–90 s per side. Aldri smerte i kneet.","Hælkrok på store tak: hælen i hoftehøyde, roter hofta inn over hælen, hold 3 s. 5 per side."],
 ["Couch stretch","couch","Bakre kne inntil veggen, fot opp langs veggen. Stram setet, skyv hofta fram, ikke svai. 60–90 s per side.","Hofta inn: lett vertikal vegg, store tak, hofta presset inn mot veggen og setet stramt på hvert flytt. 6–8 flytt."],
 ["Frosk","frog","Knær bredt, legger parallelt, hofta bakover. 3 × 30–45 s.","Froskestilling på vertikal vegg, hofta inn mot veggen, 3 × 20 s."],
 ["Åpen bok","open_book","Sideliggende, knærne 90°, åpne øverste arm bakover og følg med blikket. 8–10 per side, 3 s hold.","Rotasjonsflytt: lette flytt på volumer, roter overkroppen 90° og strekk etter taket med motsatt hånd. 6–8 flytt."],
 ["Katt–ku + bird dog","birddog","Katt–ku 10 runder. Bird dog: motsatt arm og bein strakt, ryggen stille, 3 s hold, 8 per side.","Kryssflytt: lette buldre der du alltid flytter motsatt hånd og fot. 6–8 flytt."]];
function weekIndex(i){ return SEASON.findIndex(x=>x.y===i.y&&x.w===i.w); }
function mobFor(i){ const k=Math.max(0,weekIndex(i))*3; return [0,1,2].map(n=>MOB[(k+n)%MOB.length]); }

/* ============ ØKTENE ============ */
const B=(h,items,dur)=>({h,items,dur});
const LB="Lange buldre: så mange flytt at det tilsvarer 2–3 vanlige buldre satt sammen (45–90 s). Fullfør hvert.";
function session(date,noTheme){
  const i=info(date), w=i.w;
  const s={i,key:"hvile",title:"Hvile",time:"–",blocks:[],notes:[],fields:[]};
  if(i.phase==="før"||i.phase==="etter"){ s.title=i.label; s.key="utenfor"; return s; }
  const md=date.getMonth()===11?date.getDate():0;
  if(i.phase==="jul"){
    s.key="jul"; s.title="Jul – fri";
    s.blocks=[B("I dag",["Fri, lek, lett klatring. Mobilitet hjemme."])];
    if(md>=24&&md<=27) s.notes.push(["stop","24.–27. des: ingen harde økter."]);
    return s;
  }
  if(i.light) s.notes.push(["warn","Lett uke: samme økter, halvt antall forsøk/runder/sett (avrund ned), samme intensitet."]);
  if(i.comp) s.notes.push(["warn",`Konkurranseuke – ${i.comp.navn} ${i.comp.dato}: halvt volum, samme intensitet, ingen campus, ingen PE, ingen nye øvelser.`]);
  const warm=(mob)=>B("Oppvarming",["5 min puls"+(mob?", 8 min mobilitet (dyp knebøy, couch, 90/90, maks 30 s per hold)":", 5 min mobilitet")+".","15 min lett klatring med teknikktemaet – pyramide lett → middels."],mob?"28 min":"25 min");
  switch(i.dow){
  case 1: {
    s.key="man"; s.title="Hard buldring"; s.time="ca. 1 t 45";
    if(i.y===2027&&w===13) s.notes.push(["warn","2. påskedag: økta flyttes til tirsdag ved behov – da utgår Styrke A."]);
    let mx, hov;
    if(i.M===1){ mx=(i.y===2027&&(w===2||w===3))?15:18; hov="5–6 buldre 1–2 grader under maks, RPE 7–8, 3 min pause."; }
    else if(i.M===2){ mx=15; hov="4–6 buldre på og over maks, RPE 9–10, 3–4 min pause."; }
    else { mx=12; hov="4–5 buldre på maks, RPE 9, 4–5 min pause."; }
    if(i.phase==="nm") mx=8; else if(i.comp||i.light) mx=halfDown(mx);
    if(i.phase==="nm") hov="Hard buldring, RPE 8–9. Siste harde økt.";
    s.count=mx;
    s.blocks=[warm(true),B("Hoveddel",[hov,`<span class="key">Maks ${mx} forsøk.</span>`,"Minst halvparten av buldrene krever timing: dynamiske flytt, koordinasjon, hæl/tåkroker, rotasjon.",
      "<a href='#teknikk' data-anchor='rutine'>Rutinen</a> før hvert forsøk.","Sluttpunkt: forsøkstaket, eller to forsøk på rad med tydelig teknikkfall (flytt blir statiske, fot smeller, hofte glir)."],"65–70 min"),
      B("Nedtrapping",["Lett klatring."],"10 min")];
    s.fields=[["antall",`Forsøk (maks ${mx})`]];
    break; }
  case 2: {
    s.key="tir"; s.title=i.comp?"Kort styrke + mobilitet":"Styrke A · muskelkjeder, kjerne, mobilitet"; s.time=i.comp?"30 min":"ca. 80 min"; s.strA=true;
    s.blocks=[B("Oppvarming",["5 min sykkel eller hopptau · katt–ku 10 · 90/90 10 bytter · couch stretch 30 s /side · dyp knebøy-hold 2 × 30 s · hengsel med lett kule 2 × 8 · strikk pull-aparts 2 × 15."],i.comp?"":"15 min")];
    s.notes.push(["acc","Ingen fingerbelastning i dag."]);
    s.fields=[["swing","Swing (kg)"]];
    break; }
  case 3: {
    s.key="ons";
    if(i.comp){ s.title="Lett klatring"; s.time="30 min"; s.blocks=[B("Økt",["Ingen PE – 30 min lett klatring."],"30 min")]; break; }
    if(i.phase==="f3"){ const r=i.light?2:4; s.title="Rutedag på led · 2 × 4"; s.time="ca. 1 t 30";
      s.blocks=[B("Oppvarming",["Lett buldring, 2 lette ruter på led."],"20 min"),B("2 × 4",["2 ruter på rad, bare sikringsbyttet som pause, 1–2 grader under onsight, RPE 7–8.",`<span class="key">${r} runder, 8 min pause.</span>`,"Fall eller heng → neste runde ett hakk lettere. Alt lett → ett hakk hardere neste økt."],"55 min"),B("Nedtrapping",["Lett klatring."],"10 min")];
      s.fields=[["antall","Runder"]]; break; }
    const f2=i.y===2027&&w>=2, n=i.light?4:8;
    s.title="Linked boulders"; s.time="ca. 1 t 20";
    s.blocks=[warm(false),B("Linked boulders",[LB,f2?"10–14 hardere flytt, 2–3 grader under maks, RPE 7–8, 3 min pause mellom hvert.":"12–20 flytt, 3–4 grader under maks, RPE 6–7, 3–4 min pause mellom hvert.",
      `<span class="key">${n} lange buldre</span>${n===8?", 8 min ekstra pause etter de fire første":""}.`,"Nye buldre hver uke. Fall → neste lange buldre: bytt den vanskeligste delen med én grad lettere.","Tak: volumvegg, slopere og pinch – ikke bare lister."],"40 min"),
      B("Nedtrapping",["Lett klatring."],"15 min")];
    s.fields=[["antall","Lange buldre"]];
    break; }
  case 4: {
    s.key="tor"; s.title="3×10 + mobilitet"; s.time="ca. 1 t 10";
    const r=(i.light||i.comp||i.phase==="nm")?2:3;
    s.tre=B("3×10",["Ingen egen oppvarming – første runde er oppvarmingen.",`<span class="key">${r} runder × 10 min</span> sammenhengende lett klatring, 4+ grader under onsight, RPE 3–4, 5 min pause. Store tak, rette armer.`],"45 min");
    s.mob=true;
    if(i.test){ s.notes.push(["acc","Testuke: dyp knebøy med hæler nede (ja/nei) og høyeste fot på veggen uten armtrekk. Før i loggen."]); s.testFields=true; }
    break; }
  case 5: s.blocks=[B("Hviledag",["Gjerne 10 min mobilitet hjemme."])]; break;
  case 6: {
    s.key="lor";
    if(i.comp){ s.title=`${i.comp.navn}${i.comp.sted?" "+i.comp.sted:""}`; s.time="";
      s.blocks=[B("Konkurranse",["Ingen Styrke B, ingen campus.","Oppvarming som før hard buldring.","<a href='#teknikk' data-anchor='rutine'>Rutinen</a> før hvert forsøk."])];
      s.fields=[["resultat","Resultat / plassering"]]; break; }
    s.strB=true; s.time=i.odd?"ca. 2 t 45":"ca. 3 t";
    s.pause=B("Pause",["Sitt eller gå rolig, 10 min lett mobilitet (90/90, åpen bok, due). Ikke stretching av underarmer og fingre.","Tunge armer etter pausen → ett sett mindre neste gang."],"30 min");
    if(i.odd){
      s.title="Styrke B + buldring";
      let items, dur="50 min";
      if(i.phase==="f1"){ const mx=i.light?6:12; items=[`5–6 koordinasjonsbuldre (dynamiske flytt, paddle, deadpoint) 1–2 grader under maks, RPE 7–8, <span class="key">maks ${mx} forsøk</span>, 3–4 min pause.`]; s.max=mx; }
      else if(i.phase==="f2"){ const mx=i.light?5:10; items=[`4–5 harde buldre, RPE 8–9, <span class="key">maks ${mx} forsøk</span>, 5 min pause.`]; s.max=mx; }
      else { items=["<a href='#teknikk' data-anchor='format'>Konkurranseformat</a>, veksle kvalik og finale. RPE 9."]; dur="40–60 min"; }
      items.push("Et flytt tregere eller mer statisk enn forrige forsøk: ferdig med det buldret.");
      s.del2=[B("Buldring · oppvarming",["8–10 lette buldre, pyramide."],"20 min"),B("Buldring",items,dur),B("Nedtrapping",["Lett klatring."],"10 min")];
      s.fields=[["vektet","Pull-up B (kg × reps)"],["antall","Forsøk / topper"]];
    } else {
      s.title="Styrke B + tau";
      let items, title, dur;
      if(i.y===2026||w===2){ title="Ledvolum"; dur="50 min"; items=[`${i.light?"2":"3–4"} ruter 1–2 grader under onsight, RPE 6.`,"Hvilestillinger: 3 per rute, 10 pust i hver."]; }
      else if(w<=6){ title="Onsight"; dur="50 min"; items=["3 nye ruter nær onsight-nivå, 6 min lesing, 10 min pause, <a href='#teknikk' data-anchor='rutine'>rutinen</a>."]; }
      else if(w<=14){ const r=i.light?1:(CAMPUS.has(w)?2:3); title="4 × 4"; dur="65 min"; items=["4 ruter på rad, bare sikringsbyttet som pause, 3–4 grader under onsight, RPE 7–8.",`<span class="key">${r} runde${r>1?"r":""}, 10 min pause</span> (makkers runde).`,"Stopp: to fall på rad under eget onsight-nivå."]; }
      else if(w===18){ title="Redpoint"; dur="50 min"; items=["3 forsøk på et prosjekt 1–2 grader over onsight, 15 min pause."]; }
      else { title="Onsight"; dur="50 min"; items=[`${i.light?"1 onsight-forsøk":"3 onsight-forsøk"} på ukjente ruter, 6 min lesing, 10 min pause, så 1 lettere rute.`]; }
      s.del2=[B("Tau · oppvarming",["2 lette ruter på led, hofta inn og rette armer."],"20 min"),B(`Tau · ${title} (alt på led)`,items,dur),
        B("Falltrening",["Kontrollerte fall over draget på overheng. Start med føttene ved draget (ca. 1 m fall), 4–6 fall, øk 0,5 m per økt til 2–3 m."],"10 min")];
      s.fields=[["vektet","Pull-up B (kg × reps)"],["antall","Ruter"]];
    }
    break; }
  case 7: s.blocks=[B("Hviledag",["Gjerne 10 min mobilitet hjemme."])]; break;
  }
  if(!noTheme) addTheme(s,date);
  return s;
}

function addTheme(s,date){
  if(!["man","ons","tor"].includes(s.key)||s.i.comp||s.i.phase==="nm") return;
  if(s.key==="ons"&&s.i.phase==="f3") return;
  const tu=temaUke(s.i), t=s.key==="tor"?tu.tre:tu.gen;
  const txt=`Teknikktema: <a class="key" href="#teknikk" data-anchor="tema-${t.id}">${t.n}</a> – ${s.key==="tor"?t.tre:t.drill[0]}`;
  s.theme=t.n;
  const blk=s.key==="tor"?s.tre:s.blocks.find(b=>b.h==="Oppvarming"); if(blk) blk.items.unshift(txt);
}

let LOG={};
const LS_KEY=KEY+"-logg-v1";
function lsGet(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }
function loadLocal(){ try{ LOG=JSON.parse(lsGet(LS_KEY)||"{}")||{}; }catch(e){ LOG={}; } }
function initDb(){ loadLocal(); document.getElementById("syncState").textContent="Logg på denne telefonen"; }
async function saveEntry(date,entry){ LOG[date]=entry; lsSet(LS_KEY,JSON.stringify(LOG)); return lsGet(LS_KEY)?"Lagret på denne telefonen.":"Kunne ikke lagre – nettleseren blokkerer lagring."; }
async function deleteEntry(date){ delete LOG[date]; lsSet(LS_KEY,JSON.stringify(LOG)); }
const FN={gronn:"grønn",gul:"gul",oransje:"oransje",rod:"rød",svart:"svart"};
const has=v=>v!=null&&v!=="";
const FIELDS=["antall","swing","vektet","resultat"];
function reportDetail(e){ const t=[]; if(e.miljo) t.push("ga en yngre utøver oppmerksomhet"); for(const f of FIELDS) if(has(e[f])) t.push(`${e[f+"Navn"]||f} ${e[f]}`);
  if(e.knebHael!=null&&e.knebHael!=="") t.push(`knebøy hæler nede: ${e.knebHael?"ja":"nei"}`); if(has(e.fot)) t.push(`høyeste fot ${e.fot} cm`);
  if(e.rygg) t.push("rygg vond etter styrke"); if(e.kommentar) t.push(e.kommentar); return t.join(" · "); }
function entryLine(k){ const e=LOG[k], d=parseYmd(k); const det=reportDetail(e); return `${DAYS[isoWeek(d).dow]} ${fmt(d)}: ${FN[e.farge]||"–"} · ${e.okt||""}${det?" · "+det:""}`; }
function summary(scope){
  let keys=Object.keys(LOG).sort();
  const head=`Treningslogg ${initialer()}\nPersonlig treningsinformasjon – slettes etter vurdering.`;
  if(scope==="uke"){ const {y,w}=isoWeek(cur); const m=mondayOf(y,w); const a=ymd(m), z=ymd(addDays(m,6));
    keys=keys.filter(k=>k>=a&&k<=z); return `${head}\nUke ${w}\n`+(keys.length?keys.map(entryLine).join("\n"):"Ingen økter logget."); }
  let out=`${head}\nVinteren 2026/27`, lastW=null;
  keys.forEach(k=>{ const w=isoWeek(parseYmd(k)).w; if(w!==lastW){ out+=`\n\nUke ${w}`; lastW=w; } out+="\n"+entryLine(k); });
  return keys.length?out:out+"\nIngen økter logget.";
}
async function shareText(t,msgEl){
  try{ if(navigator.share){ await navigator.share({title:"Treningslogg",text:t}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(t); msgEl.textContent="Kopiert – lim inn i en melding til trener."; return; }catch(e){}
  const ta=document.getElementById("shareFallback"); ta.value=t; ta.hidden=false; ta.select(); msgEl.textContent="Kopier teksten under.";
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify({utover:NAVN,versjon:1,logg:LOG},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=KEY+"-logg-"+ymd(cur)+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function restoreBackup(file,msgEl){
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); const l=o&&o.logg; if(!l||typeof l!=="object") throw 0;
      let n=0; for(const k in l){ if(/^\d{4}-\d\d-\d\d$/.test(k)&&!LOG[k]){ LOG[k]=l[k]; n++; } }
      lsSet(LS_KEY,JSON.stringify(LOG)); render(); const m=document.getElementById("shareMsg"); if(m) m.textContent=`Hentet inn ${n} økter.`; }
    catch(e){ msgEl.textContent="Fant ingen logg i filen."; } };
  r.readAsText(file);
}
function alerts(date){
  const out=[]; const ds=ymd(date);
  const prev=Object.keys(LOG).filter(k=>k<ds).sort(); const lastK=prev[prev.length-1];
  if(prev.some(k=>(date-parseYmd(k))/864e5<=14&&LOG[k].rygg)) out.push(["stop","Rygg vond dagen etter styrke: halv vekt på swing og enbeins markløft i to uker. Stråler nedenfor kneet, nummenhet eller kraftsvikt → stopp, lege samme uke."]);
  const last2=prev.slice(-2).map(k=>LOG[k].farge);
  if(last2.length===2&&last2.every(f=>f==="oransje"||f==="rod")) out.push(["stop","To oransje/røde dager på rad → neste harde økt blir 3×10."]);
  else if(lastK&&LOG[lastK].farge==="oransje") out.push(["warn","Oransje sist: i dag bare mobilitet, ingen eksplosiv styrke."]);
  if(lastK&&LOG[lastK].farge==="svart") out.push(["stop","Sist logget svart: ikke tren før du har snakket med trener."]);
  if(lastK&&LOG[lastK].farge==="rod") out.push(["stop","Sist logget rød: trenger flere hviledager."]);
  return out;
}

/* SVG: farger per uke */
function svgColorBars(weeks,opts={}){
  const W=opts.w||360,H=opts.h||150,pl=24,pb=22,pt=8,bw=(W-pl-6)/Math.max(weeks.length,1);
  const max=Math.max(4,...weeks.map(({y,w})=>Object.values(weekColors(y,w)).reduce((a,b)=>a+b,0)));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fargen på dagen per uke" style="width:100%;height:auto;display:block">`;
  for(let t=0;t<=max;t+=2){ const y=H-pb-(H-pb-pt)*t/max; s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-6}" y="${y+4}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${t}</text>`; }
  weeks.forEach(({y,w},ix)=>{ const c=weekColors(y,w); let acc=0; const x=pl+ix*bw+bw*0.15, bwi=bw*0.7;
    FORDER.forEach(f=>{ const n=c[f]||0; if(!n) return; const h=(H-pb-pt)*n/max, yy=H-pb-(H-pb-pt)*(acc+n)/max; s+=`<rect x="${x}" y="${yy}" width="${bwi}" height="${h}" fill="${FARGER[f]}" rx="2"/>`; acc+=n; });
    if(weeks.length<=12||ix%2===0) s+=`<text x="${x+bwi/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".6">${w}</text>`; });
  return s+`</svg>`;
}
/* SVG: målinger over tid */
function svgMetric(points,opts={}){
  const W=opts.w||360,H=opts.h||150,pl=26,pb=22,pt=10,pr=8;
  if(points.length<1) return `<p class="small muted">Ingen målinger ennå.</p>`;
  const t0=+points[0].d, t1=Math.max(+points[points.length-1].d, t0+864e5*7);
  const vals=points.flatMap(p=>Object.values(p.v));
  let lo=METRIC.fixed?METRIC.fixed[0]:Math.floor(Math.min(...vals)-1), hi=METRIC.fixed?METRIC.fixed[1]:Math.ceil(Math.max(...vals)+1);
  const X=d=>pl+(W-pl-pr)*((+d-t0)/(t1-t0)), Y=v=>H-pb-(H-pb-pt)*((v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${METRIC.title}" style="width:100%;height:auto;display:block">`;
  const step=(hi-lo)>12?Math.ceil((hi-lo)/5):((hi-lo)>6?2:1);
  for(let v=lo;v<=hi;v+=step){ s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${v}</text>`; }
  if(METRIC.limit!=null) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(METRIC.limit)}" y2="${Y(METRIC.limit)}" stroke="#d62f2f" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-pr}" y="${Y(METRIC.limit)-4}" font-size="11" text-anchor="end" fill="#d62f2f">grense ${METRIC.limit}</text>`;
  METRIC.series.forEach(se=>{ const pts=points.filter(p=>p.v[se.k]!=null);
    if(pts.length>1) s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v[se.k]).toFixed(1)).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ s+=`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v[se.k]).toFixed(1)}" r="3.5" fill="${se.color}"/>`; }); });
  s+=`<text x="${pl}" y="${H-6}" font-size="11" fill="currentColor" fill-opacity=".6">${fmt(points[0].d)}</text><text x="${W-pr}" y="${H-6}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${fmt(new Date(t1))}</text>`;
  return s+`</svg>`;
}

/* Bilde-rapport (canvas → PNG) */
function reportCanvas(scope){
  const Wd=1080, pad=56, cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const {y:cy,w:cw}=isoWeek(cur), mon=mondayOf(cy,cw);
  const rows=[];
  if(scope==="uke") for(let k=0;k<7;k++){ const d=addDays(mon,k), e=LOG[ymd(d)]; const s=session(d,true); if(e||s.key!=="hvile") rows.push({d,e,s}); }
  const weeks=weeksUpTo(cur).slice(scope==="uke"?-8:0);
  const H=pad*2+150+(scope==="uke"?rows.length*92+40:0)+300+300+120;
  cv.width=Wd; cv.height=H; const S=(f,c)=>{ ctx.font=f; ctx.fillStyle=c||"#1d2321"; };
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,Wd,H);
  ctx.fillStyle="#0f6b5f"; ctx.fillRect(0,0,Wd,12);
  let y=pad+30;
  S("700 44px system-ui,sans-serif"); ctx.fillText(`Treningslogg · ${initialer()}`,pad,y);
  y+=46; S("400 28px system-ui,sans-serif","#5f6a66");
  ctx.fillText(scope==="uke"?`Uke ${cw} · ${fmt(mon)} – ${fmt(addDays(mon,6))}`:`Vinteren 2026/27 · til ${fmt(cur)}`,pad,y);
  y+=50;
  if(scope==="uke"){
    rows.forEach(({d,e,s})=>{
      ctx.fillStyle="#f4f3ef"; ctx.fillRect(pad,y-8,Wd-pad*2,80);
      ctx.beginPath(); ctx.arc(pad+36,y+32,20,0,7); ctx.fillStyle=e&&e.farge?FARGER[e.farge]:"#dedbd2"; ctx.fill();
      S("700 28px system-ui,sans-serif"); ctx.fillText(`${DAYS[isoWeek(d).dow]} ${d.getDate()}.`,pad+72,y+24);
      S("400 26px system-ui,sans-serif"); ctx.fillText(((e&&e.okt)||s.title).slice(0,34),pad+200,y+24);
      S("400 23px system-ui,sans-serif","#5f6a66"); ctx.fillText(e?reportDetail(e).slice(0,64):"ikke logget",pad+200,y+56);
      y+=92; });
    y+=20;
  }
  // farger per uke
  S("700 28px system-ui,sans-serif"); ctx.fillText("Fargen på dagen per uke",pad,y); y+=20;
  y=drawBars(ctx,weeks,pad,y,Wd-pad*2,220)+40;
  // måling
  S("700 28px system-ui,sans-serif"); ctx.fillText(METRIC.title,pad,y); y+=20;
  const pts=metricPoints().filter(p=>scope!=="uke"||p.d>=addDays(mon,-49));
  y=drawLine(ctx,pts,pad,y,Wd-pad*2,220)+50;
  S("400 22px system-ui,sans-serif","#9a5b00");
  ctx.fillText("Personlig treningsinformasjon. Treneren sletter rapporten etter vurdering.",pad,Math.min(y,H-pad));
  return cv;
}
function drawBars(ctx,weeks,x0,y0,W,H){
  const max=Math.max(4,...weeks.map(({y,w})=>Object.values(weekColors(y,w)).reduce((a,b)=>a+b,0))), bw=W/Math.max(weeks.length,1);
  ctx.strokeStyle="#e6e3da"; ctx.lineWidth=1; for(let t=0;t<=max;t+=2){ const yy=y0+H-H*t/max; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0+W,yy); ctx.stroke(); }
  weeks.forEach(({y,w},ix)=>{ const c=weekColors(y,w); let acc=0; const x=x0+ix*bw+bw*0.15;
    FORDER.forEach(f=>{ const n=c[f]||0; if(!n) return; ctx.fillStyle=FARGER[f]; ctx.fillRect(x,y0+H-H*(acc+n)/max,bw*0.7,H*n/max-2); acc+=n; });
    if(weeks.length<=14||ix%2===0){ ctx.font="400 20px system-ui,sans-serif"; ctx.fillStyle="#5f6a66"; ctx.textAlign="center"; ctx.fillText(String(w),x+bw*0.35,y0+H+26); ctx.textAlign="left"; } });
  return y0+H+30;
}
function drawLine(ctx,pts,x0,y0,W,H){
  ctx.font="400 22px system-ui,sans-serif"; ctx.fillStyle="#5f6a66";
  if(!pts.length){ ctx.fillText("Ingen målinger i perioden.",x0,y0+40); return y0+60; }
  const t0=+pts[0].d, t1=Math.max(+pts[pts.length-1].d,t0+864e5*7), vals=pts.flatMap(p=>Object.values(p.v));
  const lo=METRIC.fixed?METRIC.fixed[0]:Math.floor(Math.min(...vals)-1), hi=METRIC.fixed?METRIC.fixed[1]:Math.ceil(Math.max(...vals)+1);
  const X=d=>x0+40+(W-40)*((+d-t0)/(t1-t0)), Y=v=>y0+H-H*((v-lo)/(hi-lo));
  ctx.strokeStyle="#e6e3da"; const step=(hi-lo)>12?Math.ceil((hi-lo)/5):((hi-lo)>6?2:1);
  for(let v=lo;v<=hi;v+=step){ ctx.beginPath(); ctx.moveTo(x0+40,Y(v)); ctx.lineTo(x0+W,Y(v)); ctx.stroke(); ctx.fillText(String(v),x0,Y(v)+8); }
  if(METRIC.limit!=null){ ctx.setLineDash([10,8]); ctx.strokeStyle="#d62f2f"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0+40,Y(METRIC.limit)); ctx.lineTo(x0+W,Y(METRIC.limit)); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; }
  METRIC.series.forEach((se,si)=>{ const p=pts.filter(q=>q.v[se.k]!=null); ctx.strokeStyle=se.color; ctx.fillStyle=se.color; ctx.lineWidth=4;
    ctx.beginPath(); p.forEach((q,i)=>{ i?ctx.lineTo(X(q.d),Y(q.v[se.k])):ctx.moveTo(X(q.d),Y(q.v[se.k])); }); ctx.stroke();
    p.forEach(q=>{ ctx.beginPath(); ctx.arc(X(q.d),Y(q.v[se.k]),6,0,7); ctx.fill(); });
    ctx.font="400 22px system-ui,sans-serif"; ctx.fillText("● "+se.name,x0+40+si*260,y0+H+34); });
  ctx.lineWidth=1;
  return y0+H+40;
}
async function shareReport(scope,msgEl){
  const text=summary(scope);
  const cv=reportCanvas(scope);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  const name=`logg-${initialer().replace(/[^A-Za-zÆØÅæøå]/g,"")}-${scope==="uke"?"uke"+isoWeek(cur).w:"sesong"}.png`;
  try{
    const file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text,title:"Treningslogg"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
    msgEl.textContent="Bildet er lastet ned. Teksten er kopiert – legg begge ved i meldingen til trener."; }catch(e){}
  try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.getElementById("shareFallback"); ta.value=text; ta.hidden=false; }
}

/* ============ RPE PÅ ALLE DELØKTER ============ */
const RPE_DEF=[
 [/^(SLUTTPUNKT|OVERGANG|HVILEDAG|INGEN )/i,null],
 [/OPPVARMING/i,"RPE 2–5, gradvis opp."],
 [/^NEDTRAPPING/i,"RPE 1–2."],
 [/PILATES/i,"RPE 4–5."],
 [/MOBILITET|^PAUSE/i,"RPE 2–3."],
 [/FALLTRENING/i,"RPE 3–4."],
 [/AKTIVERING/i,"RPE 5–6."],
 [/^KONKURRANSE$/i,"RPE 9–10."],
 [/^LETT BULDRING/i,"RPE 3–4."],
 [/^SPENST/i,"RPE 7: full fart og høyde på hver kontakt, stopp når høyden faller."],
 [/^TEST/i,"Siste løft RPE 10 – tyngste du klarer med god teknikk."],
 [/^SVA/i,"RPE 3–5."],
 [/^JAM/i,"RPE 5–9, fra lett til grensen."],
 [/KONKURRANSEUKE/i,"RPE 7."],
 [/NYE BULDRE|^HOVEDDEL|KONKURRANSEFORMAT|^DEL 2|REDPOINT|ONSIGHT/i,"RPE 8–9."],
 [/^STYRKE/i,"RPE 7–8."],
 [/^(I DAG|ØKT)/i,t=>/aktivering/i.test(t)?"Aktivering: RPE 5–6.":/Styrke A, 2 sett/.test(t)?"RPE 7.":/lett(e)? (klatr|buldr|sva|ruter)|lette (klatre|ruter)/i.test(t)?"Lett klatring: RPE 3–4.":null]];
function fillRpe(root){
  if(!root) return;
  root.querySelectorAll(".blk").forEach(bl=>{
    const h4=bl.querySelector("h4"); if(!h4) return;
    const head=(h4.childNodes[0]&&h4.childNodes[0].textContent||"").trim().toUpperCase(); if(!head) return;
    let t=bl.innerText||bl.textContent; const nx=bl.nextElementSibling; if(nx&&nx.classList.contains("exlist")) t+=nx.textContent;
    if(/RPE/.test(t)) return;
    const r=RPE_DEF.find(x=>x[0].test(head)); if(!r||!r[1]) return;
    const txt=typeof r[1]==="function"?r[1](t):r[1]; if(!txt) return;
    const html=txt.replace(/RPE \d+(–\d+)?/,m=>`<a href="#rpe">${m}</a>`);
    const ul=bl.querySelector("ul");
    if(ul) ul.insertAdjacentHTML("afterbegin",`<li>${html}</li>`); else h4.insertAdjacentHTML("afterend",`<ul><li>${html}</li></ul>`);
  });
}

document.addEventListener("click",async ev=>{
  const el=ev.target.closest("button,a"); if(!el) return;
  if(el.dataset.nav){ selDate=addDays(selDate,+el.dataset.nav); render(); return; }
  if(el.dataset.today){ ev.preventDefault(); selDate=new Date(cur); render(); return; }
  if(el.dataset.wk){ weekRef=addDays(weekRef,+el.dataset.wk); render(); return; }
  if(el.dataset.wkreset){ weekRef=new Date(cur); render(); return; }
  if(el.dataset.week){ ev.preventDefault(); weekRef=parseYmd(el.dataset.week); if(location.hash!=="#uka") location.hash="#uka"; else render(); return; }
  if(el.dataset.go){ ev.preventDefault(); selDate=parseYmd(el.dataset.go); if(location.hash!=="#idag") location.hash="#idag"; else { render(); window.scrollTo(0,0);} return; }
  if(el.dataset.farge){ draft.farge=el.dataset.farge; document.querySelectorAll(".colors button").forEach(b=>b.classList.toggle("on",b===el)); return; }
  if(el.id==="fSave"){
    const msg=document.getElementById("fMsg");
    if(!draft.farge){ msg.textContent="Velg fargen på dagen."; return; }
    const s=session(selDate,true);
    const entry={dato:ymd(selDate),uke:s.i.w,okt:s.title,farge:draft.farge,rygg:document.getElementById("fRygg").checked,
      kommentar:(document.getElementById("fKom").value||"").trim(),lagret:new Date().toISOString()};
    entry.miljo=!!(document.getElementById("fMiljo")||{}).checked;
    const kb=document.getElementById("tKneb"), fo=document.getElementById("tFot");
    if(kb) entry.knebHael=kb.checked; if(fo&&fo.value!=="") entry.fot=+fo.value;
    document.querySelectorAll("#logform [data-field]").forEach(x=>{ if(x.value.trim()!==""){ entry[x.dataset.field]=x.value.trim(); entry[x.dataset.field+"Navn"]=x.dataset.label; } });
    el.disabled=true; msg.textContent="Lagrer …";
    const r=await saveEntry(ymd(selDate),entry);
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    render(); const m2=document.getElementById("fMsg"); if(m2) m2.textContent=r; return;
  }
  if(el.dataset.anchor){ ev.preventDefault(); const go=()=>{ const t=document.getElementById(el.dataset.anchor); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); };
    const tab=el.getAttribute("href")||"#idag"; if(location.hash!==tab){ location.hash=tab; setTimeout(go,150); } else go(); return; }
  if(el.dataset.share){ const m=document.getElementById("shareMsg"); m.textContent="Lager rapport …"; shareReport(el.dataset.share,m).then(()=>{ if(m.textContent==="Lager rapport …") m.textContent=""; }); return; }
  if(el.dataset.sharetext){ shareText(summary(el.dataset.sharetext),document.getElementById("shareMsg")); return; }
  if(el.dataset.backup){ downloadBackup(); return; }
  if(el.id==="fDel"){ await deleteEntry(ymd(selDate)); render(); return; }
});
