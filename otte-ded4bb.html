<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#dedbd2;
  --accent:#0f6b5f; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --warn:#9a5b00; --warn-soft:#fff1d6; --stop:#a61e1e; --stop-soft:#fde4e4;
  --chip:#ecebe5;
  --c-gronn:#2f9e44; --c-gul:#e9b92f; --c-oransje:#ec7d10; --c-rod:#d62f2f; --c-svart:#1b1b1b;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --card:#1b2120; --ink:#e8ece9; --muted:#9aa6a1; --line:#2c3533;
    --accent:#4cc2ac; --accent-ink:#0b1513; --accent-soft:#1d3531;
    --warn:#f2b45a; --warn-soft:#3a2c14; --stop:#ff8a8a; --stop-soft:#3c1d1d;
    --chip:#252d2b; --c-svart:#000000;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --card:#1b2120; --ink:#e8ece9; --muted:#9aa6a1; --line:#2c3533;
  --accent:#4cc2ac; --accent-ink:#0b1513; --accent-soft:#1d3531;
  --warn:#f2b45a; --warn-soft:#3a2c14; --stop:#ff8a8a; --stop-soft:#3c1d1d;
  --chip:#252d2b; --c-svart:#000000;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;
  padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0 6px}
.brand h1{font-size:18px;margin:0;letter-spacing:.01em}
.brand .sub{font-size:12.5px;color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);
  padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
.banner{margin:18px 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
h2{font-size:22px;margin:4px 0 10px;line-height:1.25}
h3{font-size:16px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.tag.stop{background:var(--stop-soft);color:var(--stop);font-weight:600}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.daynav .d{font-weight:600;text-align:center;flex:1}
.daynav .d small{display:block;font-weight:400;color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--chip);border:0;border-radius:10px;padding:9px 14px;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:34px;padding:5px 11px;font-size:14px}
.blk{margin:14px 0 0}
#rutine{scroll-margin-top:110px}
.blk h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.blk .dur{float:right;font-weight:500;text-transform:none;letter-spacing:0}
ul{margin:4px 0 0;padding-left:20px}
li{margin:3px 0}
.key{font-weight:700}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:14.5px}
.note.stop{border-color:var(--stop);background:var(--stop-soft)}
.note.acc{border-color:var(--accent);background:var(--accent-soft)}
.rest{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto;margin:0 -4px}
tr.now td{background:var(--accent-soft)}
.week-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;text-decoration:none;color:inherit}
.week-row:last-child{border-bottom:0}
.week-row .wd{width:46px;flex:0 0 46px;font-weight:600}
.week-row .wd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.week-row .wt{flex:1}
.week-row .wt small{color:var(--muted)}
.week-row.today{background:var(--accent-soft);border-radius:10px;padding-left:8px;padding-right:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.f-gronn{background:var(--c-gronn)} .f-gul{background:var(--c-gul)} .f-oransje{background:var(--c-oransje)}
.f-rod{background:var(--c-rod)} .f-svart{background:var(--c-svart)}
/* logg form */
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}
.colors button{border:2px solid transparent;border-radius:10px;padding:9px 2px 7px;background:var(--chip);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.colors button .dot{width:20px;height:20px}
.colors button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=number],input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saved{font-size:13px;color:var(--muted);margin-left:10px}
.grid{display:grid;grid-template-columns:52px repeat(4,1fr);gap:4px;font-size:12.5px;align-items:center}
.grid .h{color:var(--muted);text-align:center;font-weight:600}
.grid .wk{color:var(--muted)}
.grid .cell{height:22px;border-radius:6px;background:var(--chip)}
.grid .cell.f-gronn{background:var(--c-gronn)} .grid .cell.f-gul{background:var(--c-gul)} .grid .cell.f-oransje{background:var(--c-oransje)} .grid .cell.f-rod{background:var(--c-rod)} .grid .cell.f-svart{background:var(--c-svart)}
a{color:var(--accent)}
.grid .cur{color:var(--accent);font-weight:700}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .eh{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.entry .eh small{color:var(--muted);font-weight:400}
.entry p{margin:4px 0 0;font-size:14.5px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.ex{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.ex .fig{max-width:340px;background:#fbfbf8;border-radius:10px;border:1px solid var(--line);line-height:0}
.ex .fig svg{width:100%;height:auto;display:block}
@media (min-width:560px){.ex{grid-template-columns:220px minmax(0,1fr);gap:14px}}
.ex:last-child{border-bottom:0}
.ex .exh{display:flex;flex-direction:column;gap:2px;font-weight:600}
.ex .exh span.code{color:var(--accent);margin-right:6px}
.ex .exh .sets{white-space:nowrap;font-weight:600;color:var(--accent)}
.ex p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.ok{color:var(--accent)}
.upd{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
  background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:736px;margin:0 auto}
.upd[hidden]{display:none}
.upd p{margin:0;flex:1;font-size:14.5px}.upd .btn{background:var(--accent-ink);color:var(--accent);font-weight:700}
.ver{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 0}
.trinn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;min-height:38px;font-weight:700}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:15px}
.chk input{width:20px;height:20px}
.exlist .ex{grid-template-columns:118px minmax(0,1fr);gap:12px}
@media (min-width:560px){.exlist .ex{grid-template-columns:200px minmax(0,1fr)}}
.grid.g6{grid-template-columns:52px repeat(5,1fr)}
.vid{font-size:12.5px;font-weight:500;white-space:nowrap;margin-left:4px}
.itab .blk h4{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);font-weight:600;margin-top:10px}
.itab .blk li{font-weight:400}
.itab .nu{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:1px}
@media (min-width:640px){ .brand h1{font-size:20px} h2{font-size:26px} }
</style>

<div class="wrap">
<header class="top">
  <div class="brand"><h1>Otte <span style="font-weight:400;color:var(--muted)">· 2026/27</span></h1><span class="sub" id="syncState"></span></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<p class="ver" id="ver"></p>
<div class="upd" id="upd" hidden><p id="updTxt">Ny versjon av planen.</p><button class="btn sm" id="updBtn">Oppdater</button></div>
</div>

<script>
/* ============ KALENDER ============ */
const NAVN="Otte", KEY="otte";
const DAY = ["", "Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const DAYS = ["", "Man","Tir","Ons","Tor","Fre","Lør","Søn"];
const MON = ["jan","feb","mars","april","mai","juni","juli","aug","sep","okt","nov","des"];
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmt(d){ return d.getDate()+". "+MON[d.getMonth()]; }
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dow=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dow);
  const y=t.getUTCFullYear(); const y0=new Date(Date.UTC(y,0,1));
  return {y, w:Math.ceil(((t-y0)/864e5+1)/7), dow};
}
function mondayOf(y,w){ const jan4=new Date(y,0,4); const dow=jan4.getDay()||7; return addDays(jan4,(w-1)*7-(dow-1)); }
const SEASON=[]; for(let w=45;w<=53;w++) SEASON.push({y:2026,w}); for(let w=1;w<=20;w++) SEASON.push({y:2027,w});
const COMP={9:{navn:"NM senior",sted:"Kristiansand",dager:"lør 6.–søn 7. mars"},17:{navn:"Europe Series",sted:"Göteborg",dager:"lør 1.–søn 2. mai"},19:{navn:"Europe Series",sted:"Wien",dager:"lør 15.–søn 16. mai"}};
const NYTT={45:"Fase 1 starter",46:"Nordic hamstring",47:"Kassehopp",48:"Lett uke",49:"RDL 4 × 5–6",50:"Lengdehopp",
  1:"Lett oppstart",2:"Re-entry på fase 1-nivå",3:"Klatring på fase 2-nivå",4:"Styrke på fase 2-nivå",6:"Ettbeins landing",7:"Topping",8:"Topping",
  10:"Lett uke",11:"Kvart rotasjon",15:"Topping",16:"Topping",18:"Fase 2-nivå, eller lavenergi-uke ved eksamen",20:"Led starter"};

function info(date){
  const {y,w,dow}=isoWeek(date);
  const i={date,y,w,dow,light:false,phase:"utenfor",label:"Utenfor planen",L:1,S:1,comp:null,top:0};
  const inSeason=(y===2026&&w>=45)||(y===2027&&w<=20);
  if(!inSeason){ i.phase=(y<2026||(y===2026&&w<45))?"før":"etter"; i.label=i.phase==="før"?"Før sesongstart":"Planen er ferdig"; return i; }
  if(y===2026&&w<=51){ i.phase="f1"; i.label="Fase 1 · Kapasitet"; i.light=w===48; }
  else if(y===2026){ i.phase="jul"; i.label="Jul"; }
  else if(w===1){ i.phase="f1"; i.label="Jul · lett oppstart"; i.start=true; i.light=true; }
  else if(w<=6){ i.phase="f2"; i.label="Fase 2 · Intensitet"; i.L=w>=3?2:1; i.S=w>=4?2:1; }
  else if(w===7||w===8||w===15||w===16){ i.phase="top"; i.top=(w===7||w===15)?1:2; i.label="Topping"; i.L=2; i.S=2; }
  else if(COMP[w]){ i.phase="comp"; i.comp=COMP[w]; i.label=`${COMP[w].navn} · ${COMP[w].sted}`; i.L=2; i.S=2; }
  else if(w===20){ i.phase="led"; i.label="Led starter"; i.L=2; i.S=2; }
  else { i.phase="f2"; i.label=w===10?"Etter NM · lett uke":"Etter NM · fase 2-nivå"; i.L=2; i.S=2; i.light=w===10; }
  return i;
}
const half=n=>Math.max(1,Math.round(n/2));

/* ============ STYRKE ============ */
// [kode, navn, utførelse, figur]
const STYRKE_A=[
 ["A1","Rumensk markløft (stang, løftestropper)","Stang langs lårene, lett bøy i knærne, hofta bakover til strekk bak på låret, rett rygg. 2–3 s ned.","rdl"],
 ["A2","Pallof press (kabel)","Siden mot kabelen, press rett fram, hold 2 s uten rotasjon.","pallof"],
 ["B","Goblet squat til kasse","Kettlebell mot brystet, kontrollert ned på kasse, opp uten å vippe fram. Kassehøyden senkes gradvis. RPE 6–7 i alle faser.","goblet_box"],
 ["C1","Bulgarsk utfall (vektvest eller manualer med stropper)","Bakre fot på benk. 3 s ned til smertefri, kontrollert dybde – start grunt, øk 2–3 cm per uke. Kneet over foten.","bulgarian"],
 ["C2","Beinhev i stativ (albuestøtte)","Underarmene på putene, ryggen mot puten. Bein til vannrett, rolig ned uten sving.","leg_raise"],
 ["D1","Copenhagen-plank","Øverste bein på benk, nederste henger, kroppen rett. Lettere: kneet på benken.","copenhagen"],
 ["D2","Nordic hamstring, assistert","Knærne på matte, ankler holdt fast. Senk overkroppen fram så sakte du klarer, ta imot med hendene, skyv tilbake.","nordic"],
 ["D3","Tåhev + tibialisheving (ett bein)","Tåhev på kant, full bane, 2 s nede. Så hæl på gulv, løft tærne.","calf_tib"]];
function styrkeA(i){ // returns rows [ex, sets, reps, pause]
  const rdlReps=(i.y===2026&&i.w<=48)?"6–8":"5–6";
  const rows=[[0,4,rdlReps,i.S===2?"3 min":"2–3 min"],[1,2,"10 /side",""],[2,3,"8","90 s"],[3,3,"8–10 /bein",""],[4,3,"8–12","90 s"],
    [5,3,"20–30 s /side",""],[6,2,"4–6",""],[7,2,"12–15 /side","60 s"]];
  const out=rows.filter(r=>!(r[0]===6&&i.y===2026&&i.w<46));
  if(i.light) out.forEach(r=>r[1]=half(r[1]));
  return out;
}
const SKULDER=[
 ["B1","Scapula pull-ups","Rette armer, helt grep. Skulderbladene ned og sammen, kroppen løfter seg 5–10 cm.",3,"8","","scap"],
 ["B2","Push-ups (føtter hevet eller på ringer)","Rett kropp, albuene ca. 45°, full bane.",2,"10–12","60 s","pushup"],
 ["C1","Skulderpress (manualer)","Stående, press til strake armer uten svai. 2–3 s ned.",3,"8 → 12","","db_press"],
 ["C2","Y-hev på skrå benk","Magen på benken, lette manualer, rette armer i Y, tommel opp.",3,"10","60 s","y_incline"],
 ["D1","Utadrotasjon i kabel","Albue 90° inntil kroppen, roter ut, rolig tilbake.",2,"12–15 /side","","cable_er"],
 ["D2","Revers håndleddscurl + fingerekstensjon (strikk)","Lett manual, håndflaten ned, løft håndbaken. Så strikk rundt fingrene, spre og strekk.",2,"15–20","45 s","wrist_curl"]];

   <div class="exh"><span><span class="code">${code}</span>${name}${vid(name)}</span><span class="sets">${sets} × ${reps}</span></div>

}

const SP={pogo:["Pogos","Rette knær, stive ankler, raskt og lavt.","pogo"],step:["Gå av kasse 30 cm, land i halv knebøy","Mykt, knærne over tærne, stille.","step_off"],
  kasse:["Kassehopp 40 cm","Land mykt i halv knebøy, gå ned.","box_jump"],lengde:["Lengdehopp tobeins, submaks","Land mykt, knærne over tærne, stille.","broad_jump"],
  ett:["Ettbeins landing","Kneet følger foten, stille landing.","sl_landing"],rot:["Kvart rotasjon","90° vridning, land på to bein, kneet følger foten.","quarter_rot"]};
function spenst(i){ // [[key,sets,reps]], kontakter
  const w=i.w, y=i.y;
  if(i.phase==="top") return {list:[["pogo",2,"10"],["kasse",2,"3"]],k:26};
  let list;
  if(y===2026&&w<=46) list=[["pogo",2,"15"],["step",3,"5"]];
  else if(y===2026&&w<=49) list=[["pogo",2,"15"],["step",3,"5"],["kasse",3,"4"]];
  else if((y===2026)||(w<=5)) list=[["pogo",2,"15"],["kasse",3,"4"],["lengde",3,"4"]];
  else if(w===6||w===10) list=[["pogo",2,"15"],["lengde",3,"4"],["ett",3,"4 /bein"]];
  else list=[["pogo",2,"15"],["ett",3,"4 /bein"],["rot",3,"3 /side"]];
  if(i.light) list=list.map(([a,b,c])=>[a,half(b),c]);
  const per={pogo:15,step:5,kasse:4,lengde:4,ett:8,rot:6};
  const k=list.reduce((s,[a,b])=>s+b*(a==="pogo"?15:per[a]),0);
  return {list,k};
}

const B=(h,items,dur)=>({h,items,dur});
function serTxt(r){ const [a,b]=r.split(" × ").map(Number); return `${a*b} lange buldre`; }
function linked(i){
  const w=i.w,y=i.y;
  const f1="12–20 flytt per buldre, 3–4 grader under maks, RPE 6–7, 3 min pause mellom hvert.";
  const f2=(p)=>`10–14 flytt per buldre, 2–3 grader under maks, ${p} pause mellom hvert. RPE i hver bolk: de to første 7–8, resten 8–9.`;
  if(y===2026&&w<=46) return ["2 × 3",f1];
  if(y===2026||w===1) return [w===1?"2 × 3":(i.light?"1 × 4":"2 × 4"),f1];
  if(w===2) return ["2 × 4",f1];
  if(w===3) return ["2 × 4",f2("3–4 min")];
  if(w===7||w===15) return ["2 × 3",f2("3 min")];
  if(w===8||w===16) return ["1 × 4",f2("3 min")];
  if(w===10) return ["1 × 4",f2("3 min")];
  return ["2 × 4",f2("3 min")];
}
function session(date,noTheme){

    s.blocks=[warm("25–30 min"),B("Hoveddel",[hov,`<span class="key">Maks ${mx} forsøk.</span>`,"Board/spraywall (40°) og skrudde buldre – fordel som du vil.","Stopp: forsøkstaket, eller to forsøk på rad med tydelig teknikkfall."],"60–75 min"),B("Nedtrapping",["Volumvegg."],"10 min")];
    s.count={label:"Forsøk",max:mx};

  case 2: {

    s.strA=true; s.fields=[["rdl","RDL (kg × reps)"]];
    s.notes.push(["acc","Felles med Finn: oppvarming, A, B og C (ca. 45 min). Egne vekter, reps og dybde. Ingen klatring, ingen grepsbelastning."]);
    break; }
  case 3: {
    s.key="ons";
    if(cf){ s.title="Hvile eller lett klatring"; s.time="0–20 min"; s.blocks=[B("Økt",["Hvile, eller 20 min lett klatring."])]; break; }
    if(i.phase==="led"){ s.title="Rutedag på led"; s.time="ca. 1 t 30"; s.hard=true;
      s.blocks=[B("Oppvarming",["Lett buldring, 2 lette ruter på led."],"20 min"),B("Ruter",["6–8 ruter 2–3 grader under onsight, RPE 6."],"60 min"),B("Nedtrapping",["Lett klatring."],"10 min")];
      s.fields=[["antall","Ruter"]]; break; }
    const lv=(i.y===2026||w<=2)?1:2, sets=(i.phase==="top"&&(w===8||w===16))?1:(i.light||i.phase==="top")?2:3;
    s.title="Linked boulders"; s.time=lbTot(sets,40); s.hard=true;
    s.blocks=[warm("25 min"),B("Linked boulders",[...lbItems(sets,lv),"Land på to bein. Tak: volumvegg, slopere og pinch – ikke bare lister."],lbDur(sets)),
      B("Nedtrapping",["Lett klatring, 5 min henge og strekke skulder."],"15 min")];
    s.fields=[["antall","Sett"]];
    break; }
  case 4: {
    s.key="tor";
    if(cf){ s.title="3×10 + aktivering"; s.time="ca. 40 min";
      s.blocks=[B("3×10",["2 runder × 10 min lett klatring, RPE 3–4."],"25 min"),B("Aktivering",["3–4 middels buldre på første forsøk, RPE 5–6."],"10 min"),B("Ingen spenst eller styrke",["Siste 5 dager før konkurranse."])];
      break; }
    if(i.phase==="led"){ s.title="3×10 + skulder"; s.time="ca. 1 t 10"; }
    else { s.title="Spenst + 3×10 + skulder"; s.time="ca. 1 t 40"; s.spenst=true; }
    s.blocks=s.spenst?[B("Oppvarming",["Puls og mobilitet, ingen klatring – før spensten."],"10 min")]:[];
    s.tre=B("3×10",["Ingen egen oppvarming – første runde er oppvarmingen.",`${i.light?2:3} runder × 10 min sammenhengende lett klatring, 4+ grader under onsight, RPE 3–4, 5 min pause.`],"40 min");
    s.skulder=true; s.fields=[["antall","Spenst (kontakter)"]];
    break; }
  case 5:
    if(cf){ s.key="fre"; s.title="Hvile eller aktivering"; s.blocks=[B("I dag",["Hvile, eller 15 min aktivering."])]; }
    else { s.blocks=[B("Hviledag",["Tapt økt tas ikke igjen."])]; }
    break;
  case 6: {
    s.key="lor"; s.hard=true;
    if(cf){ s.title=`${cf.navn} ${cf.sted}`+(w===9?" – kvalik":" – dag 1"); s.time="";
      s.blocks=[B("Konkurranse",["Oppvarming 30–40 min før isolasjon: pyramide 6–8 buldre.","<a href='#teknikk' data-anchor='rutine'>Rutinen</a> før hvert forsøk.","Mat og drikke mellom runder."])];
      s.fields=[["poeng","Resultat / plassering"]]; break; }
    if(i.phase==="led"){ s.title="Enkel ledøkt"; s.time="ca. 1 t 30";
      s.blocks=[B("Oppvarming",["Lett buldring, 2 lette ruter på led."],"20 min"),B("Ruter",["8–10 ruter 3–4 grader under onsight, RPE 5–6."],"60 min"),B("Nedtrapping",["Lett klatring."],"10 min")];
      s.fields=[["antall","Ruter"]]; break; }
    let tot=i.L===1?20:18, del2=i.L===1?10:8;
    if(i.phase==="top"&&i.top===2) tot=12;
    if(i.light){ tot=half(tot); del2=half(del2); }
    s.title=i.phase==="top"?"Konkurranseformat – bare del 1":"Hard buldring – konkurranseformat"; s.time=i.phase==="top"?"ca. 1 t 30":"ca. 2 t 15";
    s.blocks=[B("Oppvarming",["Som mandag. Avslutt med 2–3 buldre som krever presisjon på første forsøk."],"30 min"),
      B("Del 1 · nye buldre",[i.L===1?"RPE 7: buldre 2 grader under maks.":"RPE 8–9.",`5 nye buldre i <a href='#teknikk' data-anchor='format'>konkurranseformat</a>. Maks 4 forsøk per buldre, <span class="key">maks ${tot} totalt</span>.`,"Ingen beta fra andre. Registrer topp, sone og forsøk."],"50 min")];
    if(i.phase!=="top") s.blocks.push(B("Del 2",[i.L===1?"RPE 7: repetere med beta.":"RPE 8–9.",`Prosjektering eller repetere det du falt på, med beta. <span class="key">Maks ${del2} forsøk.</span>`],"40 min"));
    s.blocks.push(B("Uten nye buldre",[i.L===1?"RPE 7.":"RPE 8–9.",`Mandagens tak for fasen (${i.L===1?20:15}), ingen del 2.`]));
    s.blocks.push(B("Nedtrapping",["Lett klatring."],"15 min"));
    s.fields=[["poeng","Poeng nye buldre"],["topper","Topper og soner"]];
    break; }
  case 7:
    if(cf){ s.key="lor2"; s.hard=true; s.title=`${cf.navn} ${cf.sted}`+(w===9?" – semi/finale":" – dag 2");
      s.blocks=[B("Konkurranse",["Samme rutine som i går."])]; s.fields=[["poeng","Resultat / plassering"]]; }
    else s.blocks=[B("Hviledag",["Ev. lett mobilitet."])];
    break;
  }
  if(!noTheme) addTheme(s,date);
  return s;
}

/* Teknikktema – hoftekontroll, roterer per økt (man, ons, tor) */
const TEMA=[["Hofta inn","Hvert flytt med hofta inn før hånden går.","Runde 1 hofta inn på hvert flytt, runde 2 normalt, runde 3 bare der det sparer kraft."],
 ["Stille føtter","Ingen lyd, ingen justering etter plassering.","Ingen lyd fra føttene og ingen justering etter plassering – alle tre rundene."],
 ["Flagg i stedet for fotbytte","Ingen fotbytte – flagg der du ellers ville byttet.","Runde 1 flagg på hvert flytt det går, runde 2 normalt, runde 3 bare der det sparer kraft."],
 ["Hoftedrift","Start hvert flytt med hoftebevegelsen.","Start hvert flytt med hofta – overdrevet i runde 1."],
 ["Drop knee og twist-lock","Ingen hold i låsen, maks 6–8, ≤ 30°.","Drop knee der veggen er ≤ 30°, kneet ikke under hofta, ingen hold i låsen, maks 6–8 totalt."]];
function themeOK(t,date){ const i=info(date); return !(t[0].startsWith("Drop")&&(i.y===2026||i.w<2)); }
function themeCat(s){ return ["man","ons","tor"].includes(s.key)&&s.title!=="Rutedag på led"&&!s.i.comp&&s.i.phase!=="jul"; }
const themeCache={};
function themeFor(date){
  const k=ymd(date); if(themeCache[k]) return themeCache[k];
  let n=0; for(let d=new Date(2026,10,2); d<date; d=addDays(d,1)){ const s=session(d,true); if(themeCat(s)) n++; }
  const pool=TEMA.filter(t=>themeOK(t,date));
  return themeCache[k]=pool[n%pool.length];
}
function addTheme(s,date){
  if(!themeCat(s)) return;
  const [t,d0,d3]=themeFor(date); const d=s.key==="tor"?d3:d0;
  const txt=`Teknikktema: <a class="key" href="#teknikk" data-anchor="tema-${temaId(t)}">${t}</a> – ${d}`+(t.startsWith("Drop")?" Bare når full dybde er smertefri.":"");
  s.theme=t;
  const blk=s.key==="tor"?s.tre:s.blocks.find(b=>b.h==="Oppvarming");
  if(blk) blk.items.unshift(txt);
}

/* ============ LOGG ============ */
let LOG={};
const LS_KEY=KEY+"-logg-v1";
function lsGet(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }
function loadLocal(){ try{ LOG=JSON.parse(lsGet(LS_KEY)||"{}")||{}; }catch(e){ LOG={}; } }
function initDb(){ loadLocal(); document.getElementById("syncState").textContent="Logg på denne telefonen"; }
async function saveEntry(date,entry){ LOG[date]=entry; lsSet(LS_KEY,JSON.stringify(LOG)); return lsGet(LS_KEY)?"Lagret på denne telefonen.":"Kunne ikke lagre – nettleseren blokkerer lagring."; }
async function deleteEntry(date){ delete LOG[date]; lsSet(LS_KEY,JSON.stringify(LOG)); }
const FN={gronn:"grønn",gul:"gul",oransje:"oransje",rod:"rød",svart:"svart"};
const has=v=>v!=null&&v!=="";
const FIELD_NAMES={antall:"antall",rdl:"RDL",poeng:"poeng",topper:"topper/soner"};
function entryLine(k){ const e=LOG[k], d=parseYmd(k);
  let t=`${DAYS[isoWeek(d).dow]} ${fmt(d)}: ${FN[e.farge]||"–"} · ${e.okt||""}`;
  for(const f of ["antall","rdl","poeng","topper"]) if(has(e[f])) t+=` · ${e[f+"Navn"]||FIELD_NAMES[f]}: ${e[f]}`;
  if(has(e.kUnder)||has(e.kMorgen)) t+=` · kne ${has(e.kUnder)?e.kUnder:"–"}/${has(e.kMorgen)?e.kMorgen:"–"}`;
  if(e.hevelse) t+=" · HEVELSE"; if(e.laas) t+=" · LÅSNING/SVIKT";
  if(e.kommentar) t+=` – ${e.kommentar}`;
  return t; }
function summary(scope){
  let keys=Object.keys(LOG).sort();
  const head=`Treningslogg ${initialer()} – kne = under økta / neste morgen (0–10).\nPersonlig treningsinformasjon – slettes etter vurdering.`;
  if(scope==="uke"){ const {y,w}=isoWeek(cur); const m=mondayOf(y,w); const a=ymd(m), z=ymd(addDays(m,6));
    keys=keys.filter(k=>k>=a&&k<=z);
    return `${head}\nUke ${w}\n`+(keys.length?keys.map(entryLine).join("\n"):"Ingen økter logget."); }
  let out=`${head}\nVinteren 2026/27`, lastW=null;
  keys.forEach(k=>{ const w=isoWeek(parseYmd(k)).w; if(w!==lastW){ out+=`\n\nUke ${w}`; lastW=w; } out+="\n"+entryLine(k); });
  return keys.length?out:out+"\nIngen økter logget.";
}
async function shareText(t,msgEl){
  try{ if(navigator.share){ await navigator.share({title:"Treningslogg",text:t}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(t); msgEl.textContent="Kopiert – lim inn i en melding til trener."; return; }catch(e){}
  const ta=document.getElementById("shareFallback"); ta.value=t; ta.hidden=false; ta.select(); msgEl.textContent="Kopier teksten under.";
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify({utover:NAVN,versjon:1,logg:LOG},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=KEY+"-logg-"+ymd(cur)+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function restoreBackup(file,msgEl){
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); const l=o&&o.logg; if(!l||typeof l!=="object") throw 0;
      let n=0; for(const k in l){ if(/^\d{4}-\d\d-\d\d$/.test(k)&&!LOG[k]){ LOG[k]=l[k]; n++; } }
      lsSet(LS_KEY,JSON.stringify(LOG)); render(); const m=document.getElementById("shareMsg"); if(m) m.textContent=`Hentet inn ${n} økter.`; }
    catch(e){ msgEl.textContent="Fant ingen logg i filen."; } };
  r.readAsText(file);
}

/* Varsler fra loggen */
function alerts(date){
  const out=[]; const ds=ymd(date);
  const prev=Object.keys(LOG).filter(k=>k<ds).sort();
  const lastK=prev[prev.length-1];
  const within=(k,n)=>(date-parseYmd(k))/864e5<=n;
  if(prev.some(k=>within(k,3)&&LOG[k].laas)) out.push(["stop","Låsning, eller kneet tok tak eller sviktet: stopp, kontakt fysio eller kirurg før neste økt."]);
  if(prev.some(k=>within(k,7)&&LOG[k].hevelse)) out.push(["stop","Hevelse i kneet: ingen spenst eller dyp bøy, kontakt fysio samme uke."]);
  if(lastK&&within(lastK,3)&&((has(LOG[lastK].kUnder)&&+LOG[lastK].kUnder>2)||(has(LOG[lastK].kMorgen)&&+LOG[lastK].kMorgen>2)))
    out.push(["stop","Kne over 2/10 sist: forrige nivå (dybde, vekt, hopp, teknikktema) i én uke, prøv igjen uka etter."]);
  const last2=prev.slice(-2).map(k=>LOG[k].farge);
  if(last2.length===2&&last2.every(f=>f==="oransje"||f==="rod")) out.push(["stop","To oransje/røde dager på rad → neste harde økt blir 3×10."]);
  if(lastK&&LOG[lastK].farge==="svart") out.push(["stop","Sist logget svart: ikke tren før du har snakket med trener."]);
  if(lastK&&LOG[lastK].farge==="rod") out.push(["stop","Sist logget rød: trenger flere hviledager."]);
  const i=info(date), yd=ymd(addDays(date,-1));
  if(i.dow===2&&LOG[yd]&&LOG[yd].farge==="oransje") out.push(["warn","Mandagen ble oransje → ett sett ned i styrke i dag."]);
  if(i.dow===4&&LOG[yd]&&LOG[yd].farge==="oransje") out.push(["warn","Onsdagen ble oransje → skulder ett sett ned i dag."]);
  if(LOG[yd]&&!has(LOG[yd].kMorgen)&&ds===ymd(cur)) out.push(["acc",`Fyll inn kneet i morges for gårsdagens økt: <a href="#idag" data-go="${yd}">åpne i går</a>.`]);
  return out;
}

function vUka(){
  const {y,w}=isoWeek(weekRef); const mon=mondayOf(y,w); const i=info(mon);
  let h=`<div class="daynav" style="margin-top:18px"><button class="btn sm" data-wk="-7">◀</button>
   <div class="d">Uke ${w}<small>${fmt(mon)} – ${fmt(addDays(mon,6))}</small></div><button class="btn sm" data-wk="7">▶</button></div>
   <div class="card">${tagsHtml({...i,dow:0})}<div style="margin-top:8px">`;
  for(let k=0;k<7;k++){ const d=addDays(mon,k), s=session(d,true), e=LOG[ymd(d)], today=ymd(d)===ymd(cur);
    h+=`<a class="week-row ${today?"today":""}" href="#idag" data-go="${ymd(d)}"><div class="wd">${DAYS[k+1]}<small>${d.getDate()}.</small></div>
      <div class="wt"><span class="${s.key==="hvile"?"rest":""}">${s.title}</span>${s.time&&s.time!=="–"?` <small>· ${s.time}</small>`:""}</div>
      ${e&&e.farge?`<span class="dot f-${e.farge}"></span>`:""}</a>`; }
  h+=`</div></div>`;
  if(weekRef.getTime()!==cur.getTime()) h+=`<p><button class="btn sm" data-wkreset="1">Denne uka</button></p>`;
  return h;
}

const METRIC={title:"Kne (0–10)",fixed:[0,10],limit:2,series:[{k:"kUnder",name:"under økta",color:"#0f6b5f"},{k:"kMorgen",name:"neste morgen",color:"#ec7d10"}]};
function reportDetail(e){ const t=[]; if(e.miljo) t.push("ga en yngre utøver oppmerksomhet"); for(const f of ["antall","rdl","poeng","topper"]) if(has(e[f])) t.push(`${e[f+"Navn"]||f} ${e[f]}`); if(has(e.kUnder)||has(e.kMorgen)) t.push(`kne ${has(e.kUnder)?e.kUnder:"–"}/${has(e.kMorgen)?e.kMorgen:"–"}`); if(e.hevelse) t.push("hevelse"); if(e.laas) t.push("låsning/svikt"); if(e.kommentar) t.push(e.kommentar); return t.join(" · "); }

const FARGER={gronn:"#2f9e44",gul:"#e9b92f",oransje:"#ec7d10",rod:"#d62f2f",svart:"#1b1b1b"};

function weekColors(y,w){ const m=mondayOf(y,w), c={}; for(let k=0;k<7;k++){ const e=LOG[ymd(addDays(m,k))]; if(e&&e.farge) c[e.farge]=(c[e.farge]||0)+1; } return c; }
function metricPoints(){ // [{d, values{key:num}}]

/* SVG: farger per uke */
function svgColorBars(weeks,opts={}){
  const W=opts.w||360,H=opts.h||150,pl=24,pb=22,pt=8,bw=(W-pl-6)/Math.max(weeks.length,1);
  const max=Math.max(4,...weeks.map(({y,w})=>Object.values(weekColors(y,w)).reduce((a,b)=>a+b,0)));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fargen på dagen per uke" style="width:100%;height:auto;display:block">`;
  for(let t=0;t<=max;t+=2){ const y=H-pb-(H-pb-pt)*t/max; s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-6}" y="${y+4}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${t}</text>`; }
  weeks.forEach(({y,w},ix)=>{ const c=weekColors(y,w); let acc=0; const x=pl+ix*bw+bw*0.15, bwi=bw*0.7;
    FORDER.forEach(f=>{ const n=c[f]||0; if(!n) return; const h=(H-pb-pt)*n/max, yy=H-pb-(H-pb-pt)*(acc+n)/max; s+=`<rect x="${x}" y="${yy}" width="${bwi}" height="${h}" fill="${FARGER[f]}" rx="2"/>`; acc+=n; });
    if(weeks.length<=12||ix%2===0) s+=`<text x="${x+bwi/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".6">${w}</text>`; });
  return s+`</svg>`;
}
/* SVG: målinger over tid */
function svgMetric(points,opts={}){
  const W=opts.w||360,H=opts.h||150,pl=26,pb=22,pt=10,pr=8;
  if(points.length<1) return `<p class="small muted">Ingen målinger ennå.</p>`;
  const t0=+points[0].d, t1=Math.max(+points[points.length-1].d, t0+864e5*7);
  const vals=points.flatMap(p=>Object.values(p.v));
  let lo=METRIC.fixed?METRIC.fixed[0]:Math.floor(Math.min(...vals)-1), hi=METRIC.fixed?METRIC.fixed[1]:Math.ceil(Math.max(...vals)+1);
  const X=d=>pl+(W-pl-pr)*((+d-t0)/(t1-t0)), Y=v=>H-pb-(H-pb-pt)*((v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${METRIC.title}" style="width:100%;height:auto;display:block">`;
  const step=(hi-lo)>12?Math.ceil((hi-lo)/5):((hi-lo)>6?2:1);
  for(let v=lo;v<=hi;v+=step){ s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${v}</text>`; }
  if(METRIC.limit!=null) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(METRIC.limit)}" y2="${Y(METRIC.limit)}" stroke="#d62f2f" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-pr}" y="${Y(METRIC.limit)-4}" font-size="11" text-anchor="end" fill="#d62f2f">grense ${METRIC.limit}</text>`;
  METRIC.series.forEach(se=>{ const pts=points.filter(p=>p.v[se.k]!=null);
    if(pts.length>1) s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v[se.k]).toFixed(1)).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ s+=`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v[se.k]).toFixed(1)}" r="3.5" fill="${se.color}"/>`; }); });
  s+=`<text x="${pl}" y="${H-6}" font-size="11" fill="currentColor" fill-opacity=".6">${fmt(points[0].d)}</text><text x="${W-pr}" y="${H-6}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".6">${fmt(new Date(t1))}</text>`;
  return s+`</svg>`;
}

/* Bilde-rapport (canvas → PNG) */
function reportCanvas(scope){
  const Wd=1080, pad=56, cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const {y:cy,w:cw}=isoWeek(cur), mon=mondayOf(cy,cw);
  const rows=[];
  if(scope==="uke") for(let k=0;k<7;k++){ const d=addDays(mon,k), e=LOG[ymd(d)]; const s=session(d,true); if(e||s.key!=="hvile") rows.push({d,e,s}); }
  const weeks=weeksUpTo(cur).slice(scope==="uke"?-8:0);
  const H=pad*2+150+(scope==="uke"?rows.length*92+40:0)+300+300+120;
  cv.width=Wd; cv.height=H; const S=(f,c)=>{ ctx.font=f; ctx.fillStyle=c||"#1d2321"; };
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,Wd,H);
  ctx.fillStyle="#0f6b5f"; ctx.fillRect(0,0,Wd,12);
  let y=pad+30;
  S("700 44px system-ui,sans-serif"); ctx.fillText(`Treningslogg · ${initialer()}`,pad,y);
  y+=46; S("400 28px system-ui,sans-serif","#5f6a66");
  ctx.fillText(scope==="uke"?`Uke ${cw} · ${fmt(mon)} – ${fmt(addDays(mon,6))}`:`Vinteren 2026/27 · til ${fmt(cur)}`,pad,y);
  y+=50;
  if(scope==="uke"){
    rows.forEach(({d,e,s})=>{
      ctx.fillStyle="#f4f3ef"; ctx.fillRect(pad,y-8,Wd-pad*2,80);
      ctx.beginPath(); ctx.arc(pad+36,y+32,20,0,7); ctx.fillStyle=e&&e.farge?FARGER[e.farge]:"#dedbd2"; ctx.fill();
      S("700 28px system-ui,sans-serif"); ctx.fillText(`${DAYS[isoWeek(d).dow]} ${d.getDate()}.`,pad+72,y+24);
      S("400 26px system-ui,sans-serif"); ctx.fillText(((e&&e.okt)||s.title).slice(0,34),pad+200,y+24);
      S("400 23px system-ui,sans-serif","#5f6a66"); ctx.fillText(e?reportDetail(e).slice(0,64):"ikke logget",pad+200,y+56);
      y+=92; });
    y+=20;
  }
  // farger per uke
  S("700 28px system-ui,sans-serif"); ctx.fillText("Fargen på dagen per uke",pad,y); y+=20;
  y=drawBars(ctx,weeks,pad,y,Wd-pad*2,220)+40;
  // måling
  S("700 28px system-ui,sans-serif"); ctx.fillText(METRIC.title,pad,y); y+=20;
  const pts=metricPoints().filter(p=>scope!=="uke"||p.d>=addDays(mon,-49));
  y=drawLine(ctx,pts,pad,y,Wd-pad*2,220)+50;
  S("400 22px system-ui,sans-serif","#9a5b00");
  ctx.fillText("Personlig treningsinformasjon. Treneren sletter rapporten etter vurdering.",pad,Math.min(y,H-pad));
  return cv;
}
function drawBars(ctx,weeks,x0,y0,W,H){
  const max=Math.max(4,...weeks.map(({y,w})=>Object.values(weekColors(y,w)).reduce((a,b)=>a+b,0))), bw=W/Math.max(weeks.length,1);
  ctx.strokeStyle="#e6e3da"; ctx.lineWidth=1; for(let t=0;t<=max;t+=2){ const yy=y0+H-H*t/max; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0+W,yy); ctx.stroke(); }
  weeks.forEach(({y,w},ix)=>{ const c=weekColors(y,w); let acc=0; const x=x0+ix*bw+bw*0.15;
    FORDER.forEach(f=>{ const n=c[f]||0; if(!n) return; ctx.fillStyle=FARGER[f]; ctx.fillRect(x,y0+H-H*(acc+n)/max,bw*0.7,H*n/max-2); acc+=n; });
    if(weeks.length<=14||ix%2===0){ ctx.font="400 20px system-ui,sans-serif"; ctx.fillStyle="#5f6a66"; ctx.textAlign="center"; ctx.fillText(String(w),x+bw*0.35,y0+H+26); ctx.textAlign="left"; } });
  return y0+H+30;
}
function drawLine(ctx,pts,x0,y0,W,H){
  ctx.font="400 22px system-ui,sans-serif"; ctx.fillStyle="#5f6a66";
  if(!pts.length){ ctx.fillText("Ingen målinger i perioden.",x0,y0+40); return y0+60; }
  const t0=+pts[0].d, t1=Math.max(+pts[pts.length-1].d,t0+864e5*7), vals=pts.flatMap(p=>Object.values(p.v));
  const lo=METRIC.fixed?METRIC.fixed[0]:Math.floor(Math.min(...vals)-1), hi=METRIC.fixed?METRIC.fixed[1]:Math.ceil(Math.max(...vals)+1);
  const X=d=>x0+40+(W-40)*((+d-t0)/(t1-t0)), Y=v=>y0+H-H*((v-lo)/(hi-lo));
  ctx.strokeStyle="#e6e3da"; const step=(hi-lo)>12?Math.ceil((hi-lo)/5):((hi-lo)>6?2:1);
  for(let v=lo;v<=hi;v+=step){ ctx.beginPath(); ctx.moveTo(x0+40,Y(v)); ctx.lineTo(x0+W,Y(v)); ctx.stroke(); ctx.fillText(String(v),x0,Y(v)+8); }
  if(METRIC.limit!=null){ ctx.setLineDash([10,8]); ctx.strokeStyle="#d62f2f"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0+40,Y(METRIC.limit)); ctx.lineTo(x0+W,Y(METRIC.limit)); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; }
  METRIC.series.forEach((se,si)=>{ const p=pts.filter(q=>q.v[se.k]!=null); ctx.strokeStyle=se.color; ctx.fillStyle=se.color; ctx.lineWidth=4;
    ctx.beginPath(); p.forEach((q,i)=>{ i?ctx.lineTo(X(q.d),Y(q.v[se.k])):ctx.moveTo(X(q.d),Y(q.v[se.k])); }); ctx.stroke();
    p.forEach(q=>{ ctx.beginPath(); ctx.arc(X(q.d),Y(q.v[se.k]),6,0,7); ctx.fill(); });
    ctx.font="400 22px system-ui,sans-serif"; ctx.fillText("● "+se.name,x0+40+si*260,y0+H+34); });
  ctx.lineWidth=1;
  return y0+H+40;
}

/* ============ RPE PÅ ALLE DELØKTER ============ */
const RPE_DEF=[
 [/^(SLUTTPUNKT|OVERGANG|HVILEDAG|INGEN )/i,null],
 [/OPPVARMING/i,"__OPPV__"],
 [/^NEDTRAPPING/i,"RPE 1–2."],
 [/PILATES/i,"RPE 4–5."],
 [/MOBILITET|^PAUSE/i,"RPE 2–3."],
 [/FALLTRENING/i,"RPE 3–4."],
 [/AKTIVERING/i,"RPE 5–6."],
 [/^KONKURRANSE$/i,"Full innsats."],
 [/^LETT BULDRING/i,"RPE 3–4."],
 [/^SPENST/i,"Maks innsats per kontakt, full pause. Stopp øvelsen når høyden faller, kontakten blir lang eller landingen dyp eller ustabil. Økta samlet: RPE 4–6."],
 [/^TEST/i,"Siste løft RPE 10 – tyngste du klarer med god teknikk."],
 [/^SVA/i,"RPE 3–5."],
 [/^JAM/i,"RPE 5–8."],
 [/KONKURRANSEUKE/i,"RPE 7."],
 [/NYE BULDRE|^HOVEDDEL|KONKURRANSEFORMAT|^DEL 2|REDPOINT|ONSIGHT/i,"RPE 8–9."],
 [/^STYRKE/i,"RPE 7–8."],
 [/^(I DAG|ØKT)/i,t=>/aktivering/i.test(t)?"Aktivering: RPE 5–6.":/Styrke A, 2 sett/.test(t)?"RPE 7.":/lett(e)? (klatr|buldr|sva|ruter)|lette (klatre|ruter)/i.test(t)?"Lett klatring: RPE 3–4.":null]];
function fillRpe(root){
  if(!root||location.hash==="#rpe") return;
  root.querySelectorAll(".blk").forEach(bl=>{
    const h4=bl.querySelector("h4"); if(!h4) return;
    const head=(h4.childNodes[0]&&h4.childNodes[0].textContent||"").trim().toUpperCase(); if(!head) return;
    let t=bl.innerText||bl.textContent; const nx=bl.nextElementSibling; if(nx&&nx.classList.contains("exlist")) t+=nx.textContent;
    if(/RPE/.test(t)) return;
    const r=RPE_DEF.find(x=>x[0].test(head)); if(!r||!r[1]) return;
    let txt=typeof r[1]==="function"?r[1](t):r[1]; if(!txt) return;
    if(txt==="__OPPV__"){ const card=bl.closest(".card")||root; const klatr=[...card.querySelectorAll(".blk")].filter(x=>x!==bl&&!/\b(reps|sett)\b/i.test(x.textContent)&&!(x.nextElementSibling&&x.nextElementSibling.classList.contains("exlist"))).map(x=>x.textContent).join(" "); const nums=[...(klatr.matchAll(/RPE (\d+)(?:–(\d+))?/g))].map(m=>+(m[2]||m[1])); const mx=nums.length?Math.max(...nums):0;
      txt=mx>=8?"RPE 2 → 6–7, gradvis opp. Siste 1–2 buldre rett under øktas arbeidsintensitet.":"RPE 2–5, gradvis opp."; }
    const html=txt.replace(/RPE \d+(–\d+)?/,m=>`<a href="#rpe">${m}</a>`);
    const ul=bl.querySelector("ul");
    if(ul) ul.insertAdjacentHTML("afterbegin",`<li>${html}</li>`); else h4.insertAdjacentHTML("afterend",`<ul><li>${html}</li></ul>`);
  });
}


/* ============ FELLES DAGMAL ============ */
function normDay(root){
  try{
    if(!root||!["","#idag"].includes(location.hash)) return;
    const card=[...root.querySelectorAll(".card")].find(c=>c.querySelector(":scope > h2")); if(!card) return;
    const title=card.querySelector(":scope > h2").textContent.trim();
    // 1. Merknader rett under Tid/tagger
    const tid=[...card.children].find(e=>/^Tid:/.test(e.textContent.trim())&&e.tagName==="DIV");
    const anchor=tid||card.querySelector(":scope > .meta")||card.querySelector(":scope > h2");
    let after=anchor;
    [...card.querySelectorAll(":scope > .note")].forEach(n=>{ after.insertAdjacentElement("afterend",n); after=n; });
    // 2. Blokk med bare avsnitt -> punktliste
    card.querySelectorAll(":scope > .blk").forEach(bl=>{
      const h4=bl.querySelector("h4"); if(!h4||bl.querySelector("ul")) return;
      const ps=[...bl.querySelectorAll(":scope > p")]; if(!ps.length) return;
      const items=ps.map(x=>x.innerHTML).join(" · ").split(/\s+·\s+/).map(t=>t.trim()).filter(Boolean);
      ps.forEach(x=>x.remove());
      h4.insertAdjacentHTML("afterend","<ul>"+items.map(t=>"<li>"+t.charAt(0).toUpperCase()+t.slice(1).replace(/\.?$/,".")+"</li>").join("")+"</ul>");
    });
    // 3. Styrkeøkt: «Hoveddel» får styrkenavnet
    if(/^Styrke/i.test(title)) card.querySelectorAll(":scope > .blk > h4").forEach(h=>{ const t=h.childNodes[0]; if(t&&/^\s*Hoveddel\s*$/i.test(t.textContent)) t.textContent=title; });
    // 4. Oppvarming inne i en blokk -> egen oppvarmingsblokk foran
    card.querySelectorAll(":scope > .blk").forEach(bl=>{
      const h4=bl.querySelector("h4"); if(!h4||/OPPVARMING/i.test(h4.textContent)) return;
      const li=[...bl.querySelectorAll(":scope > ul > li")].find(x=>/^Oppvarming\b/.test(x.textContent.trim())); if(!li) return;
      const m=li.innerHTML.match(/^\s*Oppvarming\s*(\d+(?:–\d+)?\s*min)?[^:]*:\s*([\s\S]*)$/); if(!m) return;
      const items=m[2].split(/\s+·\s+|\s*–\s+(?=[A-ZÆØÅ])/).map(t=>t.trim().replace(/\.$/,"")).filter(Boolean);
      const had=[...card.querySelectorAll(":scope > .blk > h4")].some(h=>h!==h4&&/^\s*OPPVARMING\s*$/i.test(h.childNodes[0].textContent));
      const name=had?"Oppvarming · "+h4.childNodes[0].textContent.trim().split(" · ")[0]:"Oppvarming";
      const nb=document.createElement("div"); nb.className="blk";
      nb.innerHTML=`<h4>${name}${m[1]?`<span class="dur">${m[1]}</span>`:""}</h4><ul>${/RPE/.test(m[2])?"":"<li><a href=\"#rpe\">RPE 2–5</a>, gradvis opp.</li>"}${items.map(t=>"<li>"+t.charAt(0).toUpperCase()+t.slice(1)+".</li>").join("")}</ul>`;
      bl.insertAdjacentElement("beforebegin",nb); li.remove();
    });
    // 4b. Oppvarming som én lang linje -> én øvelse per punkt
    card.querySelectorAll(":scope > .blk").forEach(bl=>{
      const h4=bl.querySelector("h4"); if(!h4||!/OPPVARMING/i.test(h4.textContent)) return;
      bl.querySelectorAll(":scope > ul > li").forEach(li=>{ const parts=li.innerHTML.split(/\s+·\s+/); if(parts.length<3) return;
        li.insertAdjacentHTML("afterend",parts.map(t=>"<li>"+t.trim().charAt(0).toUpperCase()+t.trim().slice(1).replace(/\.?$/,".")+"</li>").join("")); li.remove(); });
    });
    // 4c. Innledende tekst foran første blokk -> punkt i hovedblokka
    const fb=card.querySelector(":scope > .blk");
    if(fb){ let pr=fb.previousElementSibling; const intro=[]; while(pr&&pr.tagName==="P"){ intro.unshift(pr); pr=pr.previousElementSibling; }
      const main=[...card.querySelectorAll(":scope > .blk")].find(b=>!/OPPVARMING/i.test((b.querySelector("h4")||{}).textContent||""));
      const ul=main&&main.querySelector(":scope > ul");
      if(intro.length&&ul){ intro.reverse().forEach(x=>{ ul.insertAdjacentHTML("afterbegin","<li>"+x.innerHTML+"</li>"); x.remove(); }); } }
    // 4d. Regler uten overskrift etter øvelseslista -> inn i styrkeblokka
    card.querySelectorAll(":scope > .blk").forEach(bl=>{
      if(bl.querySelector("h4")) return; const pv=bl.previousElementSibling; if(!pv||!pv.classList.contains("exlist")) return;
      const head=pv.previousElementSibling; const ul=head&&head.classList.contains("blk")&&head.querySelector(":scope > ul"); if(!ul) return;
      bl.querySelectorAll("li").forEach(li=>ul.appendChild(li)); bl.querySelectorAll(":scope > p").forEach(x=>ul.insertAdjacentHTML("beforeend","<li>"+x.innerHTML+"</li>")); bl.remove();
    });
    // 5. RPE-linja først i hver blokk
    card.querySelectorAll(":scope > .blk").forEach(bl=>{
      const ul=bl.querySelector(":scope > ul"); if(!ul) return;
      const lis=[...ul.children]; if(!lis.length||/RPE/.test(lis[0].textContent)) return;
      const r=lis.find(x=>/RPE/.test(x.textContent)); if(r) ul.insertBefore(r,lis[0]);
    });
  }catch(e){}
}

/* ============ LETTE UKER: ETT RPE-TRINN NED ============ */
function lightRpe(root){
  try{
    if(!root||KEY==="ingvild"||!["","#idag"].includes(location.hash)) return;
    const s=session(selDate,true); if(!s||!s.i||!s.i.light) return;
    const card=root.querySelector(".card"); if(!card) return;
    card.querySelectorAll(".blk").forEach(bl=>{
      const h=((bl.querySelector("h4")||{}).textContent||"").toUpperCase();
      if(/OPPVARMING|NEDTRAPPING|STYRKE|MOBILITET/.test(h)) return;
      const nx=bl.nextElementSibling; if(nx&&nx.classList.contains("exlist")) return;
      if(/\b(sett|reps)\b/i.test(bl.textContent)) return;
      bl.querySelectorAll("li").forEach(li=>{ li.innerHTML=li.innerHTML.replace(/RPE (\d+)(?:–(\d+))?/g,(m,a,b)=>{ a=+a; if(a<5) return m; return b?`RPE ${a-1}–${+b-1}`:`RPE ${a-1}`; }); });
    });
  }catch(e){}
}

/* ============ LINKED BOULDERS (Lattice) ============ */
function lbItems(sets,lvl,enkel){
  const fl=lvl===1?"ca. 14–16 flytt":"ca. 12 flytt";
  const grad=lvl===1?"RPE 6":"På flash-graden, RPE 7–8";
  const it=[enkel?`Velg 1–3 buldre på ${fl}. ${grad}. For få flytt: legg 2–4 traversflytt til starten.`:`Velg 1–3 buldre på ${fl}, jevnt vanskelige hele veien. ${grad}. For få flytt: legg 2–4 harde traversflytt til starten.`,
    `<span class="key">${sets} sett × 4 repetisjoner</span>`,
    "1 repetisjon = én klatring på buldret fra start til topp eller fall. 2 min pause mellom repetisjonene.",
    "1 sett = 4 repetisjoner på samme buldre. 5 min pause mellom settene. Har du valgt 2–3 buldre: bytt buldre mellom settene.",
    "Greit å falle på de siste flyttene på slutten av et sett. Faller du jevnlig før halvveis: lettere buldre. Alt uten fall: hardere neste økt.",
    "Bytt buldre med noen økters mellomrom."];
  return it;
}
function lbDur(sets){ return "ca. "+sets*15+" min"; }
function lbTot(sets,extra){ const m=sets*15+extra; return "ca. "+(m>=60?Math.floor(m/60)+" t"+(m%60?" "+m%60:""):m+" min"); }

/* ============ RUTING ============ */
function route(){ const t=(location.hash||"#idag").slice(1); return TABS.some(x=>x[0]===t)?t:"idag"; }
function render(){
  const t=route();
  document.getElementById("tabs").innerHTML=tabsHtml(t);
  const v=({idag:vIdag,uka:vUka,konk:vKonk,plan:vPlan,regler:vRegler,rpe:vRpe,teknikk:vTeknikk,logg:vLogg}[t]||VIEWS[t])();
  const focus=document.activeElement;
  if(t==="idag"&&focus&&focus.closest&&focus.closest("#logform")&&focus.tagName!=="BUTTON") return;
  document.getElementById("view").innerHTML=v; normDay(document.getElementById("view")); fillRpe(document.getElementById("view")); lightRpe(document.getElementById("view"));
  const on=document.querySelector("nav.tabs a.on"); if(on&&on.scrollIntoView) on.scrollIntoView({block:"nearest",inline:"nearest"});
}
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("button,a"); if(!el) return;
  if(el.dataset.nav){ selDate=addDays(selDate,+el.dataset.nav); render(); return; }
  if(el.dataset.today){ ev.preventDefault(); selDate=new Date(cur); render(); return; }
  if(el.dataset.wk){ weekRef=addDays(weekRef,+el.dataset.wk); render(); return; }
  if(el.dataset.wkreset){ weekRef=new Date(cur); render(); return; }
  if(el.dataset.week){ ev.preventDefault(); weekRef=parseYmd(el.dataset.week); if(location.hash!=="#uka") location.hash="#uka"; else render(); return; }
  if(el.dataset.go){ ev.preventDefault(); selDate=parseYmd(el.dataset.go); if(location.hash!=="#idag") location.hash="#idag"; else { render(); window.scrollTo(0,0);} return; }
  if(el.dataset.farge){ draft.farge=el.dataset.farge; document.querySelectorAll(".colors button").forEach(b=>b.classList.toggle("on",b===el)); return; }
  if(el.id==="fSave"){
    const msg=document.getElementById("fMsg");
    if(!draft.farge){ msg.textContent="Velg fargen på dagen."; return; }
    const s=session(selDate,true);
    const num=id=>{ const x=document.getElementById(id); return x&&x.value!==""?Math.max(0,Math.min(10,+x.value)):null; };
    const entry={dato:ymd(selDate),uke:s.i.w,okt:s.title,farge:draft.farge,kUnder:num("kUnder"),kMorgen:num("kMorgen"),
      hevelse:document.getElementById("kHev").checked,laas:document.getElementById("kLaas").checked,
      kommentar:(document.getElementById("fKom").value||"").trim(),lagret:new Date().toISOString()};
    entry.miljo=!!(document.getElementById("fMiljo")||{}).checked;
    document.querySelectorAll("#logform [data-field]").forEach(x=>{ if(x.value.trim()!==""){ entry[x.dataset.field]=x.value.trim(); entry[x.dataset.field+"Navn"]=x.dataset.label; } });
    el.disabled=true; msg.textContent="Lagrer …";
    const r=await saveEntry(ymd(selDate),entry);
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    render(); const m2=document.getElementById("fMsg"); if(m2) m2.textContent=r; return;
  }
  if(el.dataset.anchor){ ev.preventDefault(); const go=()=>{ const t=document.getElementById(el.dataset.anchor); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); };
    const tab=el.getAttribute("href")||"#idag"; if(location.hash!==tab){ location.hash=tab; setTimeout(go,150); } else go(); return; }
  if(el.dataset.share){ const m=document.getElementById("shareMsg"); m.textContent="Lager rapport …"; shareReport(el.dataset.share,m).then(()=>{ if(m.textContent==="Lager rapport …") m.textContent=""; }); return; }
  if(el.dataset.sharetext){ shareText(summary(el.dataset.sharetext),document.getElementById("shareMsg")); return; }
  if(el.dataset.backup){ downloadBackup(); return; }
  if(el.id==="fDel"){ await deleteEntry(ymd(selDate)); render(); return; }
});
document.addEventListener("change",ev=>{ if(ev.target.id==="restoreFile"&&ev.target.files[0]) restoreBackup(ev.target.files[0],document.getElementById("shareMsg")); });
initDb();
render();

/* ============ OPPDATERING ============ */
const APP_VERSION="2026-11-06-074028";
function verLabel(v){ const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(v); return m?`Planversjon ${+m[3]}. ${MON[+m[2]-1]} ${m[1]}`:""; }
async function checkUpdate(){
  if(APP_VERSION.startsWith("__")) return;
  try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
    const j=await r.json(); const v=j&&j[KEY]; if(!v||!v.versjon||v.versjon===APP_VERSION) return;
    document.getElementById("updTxt").textContent="Ny versjon av planen."+(v.melding?" "+v.melding:"");
    document.getElementById("upd").hidden=false; }catch(e){}
}
document.getElementById("ver").textContent=verLabel(APP_VERSION);
document.getElementById("updBtn").addEventListener("click",()=>location.reload());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
setInterval(checkUpdate,30*60*1000);
checkUpdate();
