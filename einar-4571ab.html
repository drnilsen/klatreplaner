<!doctype html><html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Einar – treningsplan</title>
<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#dedbd2;
  --accent:#0f6b5f; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --warn:#9a5b00; --warn-soft:#fff1d6; --stop:#a61e1e; --stop-soft:#fde4e4;
  --chip:#ecebe5;
  --c-gronn:#2f9e44; --c-gul:#e9b92f; --c-oransje:#ec7d10; --c-rod:#d62f2f; --c-svart:#1b1b1b;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --card:#1b2120; --ink:#e8ece9; --muted:#9aa6a1; --line:#2c3533;
    --accent:#4cc2ac; --accent-ink:#0b1513; --accent-soft:#1d3531;
    --warn:#f2b45a; --warn-soft:#3a2c14; --stop:#ff8a8a; --stop-soft:#3c1d1d;
    --chip:#252d2b; --c-svart:#000000;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --card:#1b2120; --ink:#e8ece9; --muted:#9aa6a1; --line:#2c3533;
  --accent:#4cc2ac; --accent-ink:#0b1513; --accent-soft:#1d3531;
  --warn:#f2b45a; --warn-soft:#3a2c14; --stop:#ff8a8a; --stop-soft:#3c1d1d;
  --chip:#252d2b; --c-svart:#000000;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;
  padding:0 max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0 6px}
.brand h1{font-size:18px;margin:0;letter-spacing:.01em}
.brand .sub{font-size:12.5px;color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);
  padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
.banner{margin:18px 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
h2{font-size:22px;margin:4px 0 10px;line-height:1.25}
h3{font-size:16px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.tag.stop{background:var(--stop-soft);color:var(--stop);font-weight:600}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.daynav .d{font-weight:600;text-align:center;flex:1}
.daynav .d small{display:block;font-weight:400;color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--chip);border:0;border-radius:10px;padding:9px 14px;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:34px;padding:5px 11px;font-size:14px}
.blk{margin:14px 0 0}
#rutine{scroll-margin-top:110px}
.blk h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.blk .dur{float:right;font-weight:500;text-transform:none;letter-spacing:0}
ul{margin:4px 0 0;padding-left:20px}
li{margin:3px 0}
.key{font-weight:700}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:14.5px}
.note.stop{border-color:var(--stop);background:var(--stop-soft)}
.note.acc{border-color:var(--accent);background:var(--accent-soft)}
.rest{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto;margin:0 -4px}
tr.now td{background:var(--accent-soft)}
.week-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;text-decoration:none;color:inherit}
.week-row:last-child{border-bottom:0}
.week-row .wd{width:46px;flex:0 0 46px;font-weight:600}
.week-row .wd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.week-row .wt{flex:1}
.week-row .wt small{color:var(--muted)}
.week-row.today{background:var(--accent-soft);border-radius:10px;padding-left:8px;padding-right:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.f-gronn{background:var(--c-gronn)} .f-gul{background:var(--c-gul)} .f-oransje{background:var(--c-oransje)}
.f-rod{background:var(--c-rod)} .f-svart{background:var(--c-svart)}
/* logg form */
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}
.colors button{border:2px solid transparent;border-radius:10px;padding:9px 2px 7px;background:var(--chip);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.colors button .dot{width:20px;height:20px}
.colors button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=number],input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saved{font-size:13px;color:var(--muted);margin-left:10px}
.grid{display:grid;grid-template-columns:52px repeat(4,1fr);gap:4px;font-size:12.5px;align-items:center}
.grid .h{color:var(--muted);text-align:center;font-weight:600}
.grid .wk{color:var(--muted)}
.grid .cell{height:22px;border-radius:6px;background:var(--chip)}
.grid .cell.f-gronn{background:var(--c-gronn)} .grid .cell.f-gul{background:var(--c-gul)} .grid .cell.f-oransje{background:var(--c-oransje)} .grid .cell.f-rod{background:var(--c-rod)} .grid .cell.f-svart{background:var(--c-svart)}
a{color:var(--accent)}
.grid .cur{color:var(--accent);font-weight:700}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .eh{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.entry .eh small{color:var(--muted);font-weight:400}
.entry p{margin:4px 0 0;font-size:14.5px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.ex{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.ex .fig{max-width:340px;background:#fbfbf8;border-radius:10px;border:1px solid var(--line);line-height:0}
.ex .fig svg{width:100%;height:auto;display:block}
@media (min-width:560px){.ex{grid-template-columns:220px minmax(0,1fr);gap:14px}}
.ex:last-child{border-bottom:0}
.ex .exh{display:flex;flex-direction:column;gap:2px;font-weight:600}
.ex .exh span.code{color:var(--accent);margin-right:6px}
.ex .exh .sets{white-space:nowrap;font-weight:600;color:var(--accent)}
.ex p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.ok{color:var(--accent)}
.upd{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
  background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:736px;margin:0 auto}
.upd[hidden]{display:none}
.upd p{margin:0;flex:1;font-size:14.5px}.upd .btn{background:var(--accent-ink);color:var(--accent);font-weight:700}
.ver{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 0}
.trinn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;min-height:38px;font-weight:700}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:15px}
.chk input{width:20px;height:20px}
.exlist .ex{grid-template-columns:118px minmax(0,1fr);gap:12px}
@media (min-width:560px){.exlist .ex{grid-template-columns:200px minmax(0,1fr)}}
.grid.g6{grid-template-columns:52px repeat(5,1fr)}
.vid{font-size:12.5px;font-weight:500;white-space:nowrap;margin-left:4px}
.itab .blk h4{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);font-weight:600;margin-top:10px}
.itab .blk li{font-weight:400}
.itab .nu{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:1px}
@media (min-width:640px){ .brand h1{font-size:20px} h2{font-size:26px} }
</style>
</head><body>
<div class="wrap">
<header class="top">
  <div class="brand"><h1>Einar <span style="font-weight:400;color:var(--muted)">· trening</span></h1><span class="sub" id="syncState"></span></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<p class="ver" id="ver"></p>
<div class="upd" id="upd" hidden><p id="updTxt">Ny versjon av planen.</p><button class="btn sm" id="updBtn">Oppdater</button></div>
</div>
<script>
/* ============ KALENDER ============ */
const NAVN="Einar", KEY="einar";
const DAY=["","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const DAYS=["","Man","Tir","Ons","Tor","Fre","Lør","Søn"];
const MON=["jan","feb","mars","april","mai","juni","juli","aug","sep","okt","nov","des"];
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmt(d){ return d.getDate()+". "+MON[d.getMonth()]; }
function dowOf(d){ return d.getDay()||7; }
function monday(d){ return addDays(d,1-dowOf(d)); }
function dayDiff(a,b){ return Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5); }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ============ LAGRING ============ */
let LOG={}, SET={};
const LS_KEY=KEY+"-logg-v1", SET_KEY=KEY+"-innst-v1";
const SET_DEF={frekv:1,frekvFra:"",trinn:1,sitt:15,beinB:false,beinBfra:"",start:"2026-11-09"};
function lsGet(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }
function loadLocal(){
  try{ LOG=JSON.parse(lsGet(LS_KEY)||"{}")||{}; }catch(e){ LOG={}; }
  try{ SET=Object.assign({},SET_DEF,JSON.parse(lsGet(SET_KEY)||"{}")||{}); }catch(e){ SET=Object.assign({},SET_DEF); }
}
function saveSet(){ lsSet(SET_KEY,JSON.stringify(SET)); }
function saveLog(){ lsSet(LS_KEY,JSON.stringify(LOG)); }

/* ============ UKE ============ */
// Lett uke hver fjerde uke, regnet fra startuka.
function info(date){
  const dow=dowOf(date), w=isoWeek(date);
  const n=Math.floor(dayDiff(monday(date),parseYmd(SET.start))/7);
  const lett=n>=0&&n%4===3;
  return {dow,w,lett,syklus:n>=0?(n%4)+1:null};
}
// Bein B går på halvt volum de fire første ukene.
function beinBhalv(date){ if(!SET.beinBfra) return true; return dayDiff(date,parseYmd(SET.beinBfra))<28; }

/* ============ INNHOLD ============ */
const B=(h,items,dur)=>({h,items,dur});
const TEMPO="3 s opp, 3 s ned";
const TRINN=[
  {n:1,navn:"Det du tåler nå",inn:"Bekkenvipp, navle inn, beinstrekk på alle fire, start av sit-up",krit:"3 rolige uker · sitter 25 min",sitt:25},
  {n:2,navn:"Litt mer bevegelse",inn:"Hælskyv, bird-dog, åpen bok · lett Pallof-press",krit:"3 rolige uker · sitter 30 min",sitt:30},
  {n:3,navn:"Første isometri",inn:"Dead bug med hælskyv, kort sideplanke på knær, ligge på magen med pute",krit:"3 rolige uker · sitter 40 min",sitt:40},
  {n:4,navn:"Første lengde",inn:"Mageliggende på albuer, stående tilbakelening med hendene på hofta",krit:"3 rolige uker · sitter 50 min",sitt:50},
  {n:5,navn:"Fleksjon og rotasjon",inn:"Bjørnestilling, eksentrisk crunch, tilbakelening med armer over hodet",krit:"3 rolige uker · sitter 60 min · tåler jobbdag",sitt:60},
  {n:6,navn:"Tilbake",inn:"Heng, lett klatring, gå/jogg",krit:"",sitt:null}
];
const ARMER="Ryggliggende, armene over hodet: 3 × 5 rolige pust, så langt det er behagelig";
const MIK={
  1:["Bekkenvipp, ryggliggende: 10 rolige","Navle inn på alle fire: 5 × 10 s","Beinstrekk bakover på alle fire: 6 per side","Start av sit-up: 5, bare til skulderbladene letter",ARMER],
  2:["Bekkenvipp, ryggliggende: 10 rolige","Hælskyv, ryggliggende: 6 per side","Bird-dog, arm og bein: 6 per side, 2 s hold","Start av sit-up: 2 × 5",ARMER,"Åpen bok, sideliggende: 5 per side"],
  3:["Dead bug med hælskyv: 3 × 15 s per side","Sideplanke på knær: 3 × 10 s per side","Bird-dog, arm og bein: 3 × 20 s per side","Mageliggende med pute under magen: 1–2 min, rolig pust","Åpen bok, sideliggende: 5 per side"],
  4:["Dead bug med hælskyv: 3 × 30 s per side","Sideplanke på knær: 3 × 20–30 s per side","Bird-dog, arm og bein: 3 × 30 s per side","Mageliggende på albuer: 5 × 20 s","Stående tilbakelening, hendene på hofta: 5 × 10 s"],
  5:["Dead bug, strake bein: 3 × 30 s per side","Sideplanke på føtter: 3 × 20 s per side","Mageliggende på albuer: 5 × 20 s","Stående tilbakelening, armer over hodet: 5 × 10 s"],
  6:["Dead bug, strake bein: 3 × 30 s per side","Sideplanke på føtter: 3 × 30 s per side","Mageliggende på albuer: 5 × 20 s","Stående tilbakelening, armer over hodet: 5 × 10 s"]
};
// Hvor ofte øvelsene gjøres. Pust og hudmobilisering går hver dag.
const FREKV=[
  {n:1,navn:"3 dager",d:[1,3,5],txt:"man, ons, fre"},
  {n:2,navn:"4 dager",d:[1,3,5,7],txt:"man, ons, fre, søn"},
  {n:3,navn:"5 dager",d:[1,2,3,5,7],txt:"man, tir, ons, fre, søn"},
  {n:4,navn:"6 dager",d:[1,2,3,5,6,7],txt:"alle dager unntatt torsdag"},
  {n:5,navn:"Hver dag",d:[1,2,3,4,5,6,7],txt:"alle dager"}
];
function frekvNo(){ return Math.min(5,Math.max(1,SET.frekv|0)); }
function trinnNo(){ return Math.min(6,Math.max(1,SET.trinn|0)); }
function mikro(dow){
  const it=["Hudmobilisering langs linea alba: 2–3 min. Hudrulling og løft, først på tvers, så på langs. Drag, ikke smerte.",
            "Pust: 2 min. 360° mot hendene på nedre ribbein, lang utpust."];
  if(!FREKV[frekvNo()-1].d.includes(dow)) return B("Bukvegg – mikrodose",it.concat(["Øvelsene hviler i dag"]),"5 min");
  return B("Bukvegg – mikrodose",it.concat(MIK[trinnNo()]),"10 min");
}
function sittBlk(){ return B("Sitting",[`<span class="key">3–4 bolker à ${SET.sitt} min</span>, fordelt utover dagen`,"Åpen hoftevinkel eller ståpult resten av tiden"]); }
function kjerne(){
  const t=trinnNo();
  if(t===1) return null;
  if(t===2) return B("Belastet kjerne",["Pallof-press i kabel: 2 × 8 per side, lett"]);
  if(t===3) return B("Belastet kjerne",["Pallof-press i kabel: 3 × 8 per side, 3 s hold","Koffertbæring: 3 × 20 m per side"]);
  if(t===4) return B("Belastet kjerne",["Pallof-press i kabel: 3 × 8 per side, 3 s hold","Kabel-chop, høy til lav: 2 × 8 per side, lett","Koffertbæring: 3 × 20 m per side"]);
  if(t===5) return B("Belastet kjerne",["Kabel-chop, høy til lav: 3 × 8 per side","Bjørnestilling: 4 × 10–20 s","Eksentrisk crunch: 3 × 5, 5 s ned","Koffertbæring: 3 × 20 m per side"]);
  return B("Belastet kjerne",["Hengende kneløft: 3 × 5","Kabel-chop, høy til lav: 3 × 8 per side","Bjørnestilling: 4 × 20 s","Bondegang: 3 × 30 m"]);
}
const OVK=[["1a","Bicepscurl"],["1b","Overheadpress"],["2a","Lateral raise"],["2b","Dipspress i maskin"],["3a","Skulderhev"],["3b","Holde vekt i én hånd"],
  ["4a","Nedtrekk i maskin, sitter langt bak"],["4b","Utadrotasjon i kabel"],["4c","Innadrotasjon i kabel"],["5a","Pec deck"],["5b","Reverse fly i maskin"],
  ["6a","Sittende brystpress i maskin"],["6b","Sittende roing i kabel"],["7a","Ryggekstensjon i maskin, liten bevegelse (noen ganger)"]];
const OPPV=B("Oppvarming",["15 min","2 oppvarmingssett på alle øvelser"]);
function ovkBlk(n){ return B("Overkropp",OVK.map(([c,nv])=>`<span class="key">${c}</span> ${lnk(nv)}`).concat([`<span class="key">${n} arbeidssett</span> per øvelse · a, b og c annenhver`,"2–3 repetisjoner i reserve"])); }
const UARM=[["Håndleddscurl","12"],["Omvendt håndleddscurl","12"],["Pronasjon/supinasjon med hammer","10 per side"]];
const BEIN_A=[["Beinpress","8–10"],["Hamstringcurl","8–10"],["Tåhev, strakt kne","8–10"],["Abduksjon","12"],["Adduksjon","12"]];
const BEIN_B=[["Tåhev, bøyd kne (sittende)","10"],["Leg extension, isometrisk i ca. 60°","5 × 45 s"],["Hip thrust","8"],["Lav step-up","8 per side"]];
function sett(lett,halv){ return lett||halv?2:3; }
function exItems(list,n){ return list.map(([nv,r])=>/×/.test(r)?`${nv}: <span class="key">${r}</span>`:`${nv}: <span class="key">${n} × ${r}</span>`); }

function session(date){
  const i=info(date), dow=i.dow, s={date,i,title:"",blocks:[],tags:[]};
  s.tags.push(["acc",`Bukvegg trinn ${trinnNo()}`]);
  if(i.lett) s.tags.push(["warn","Lett uke"]);
  const n=sett(i.lett,false), k=kjerne();
  const styrkeNote=`${TEMPO} · 2–3 repetisjoner i reserve`;
  if(dow===1){ s.title="Underarm"; s.blocks.push(B("Underarm",exItems(UARM,n))); }
  if(dow===2){ s.title="Bein A"; s.blocks.push(OPPV); s.blocks.push(B("Bein A",exItems(BEIN_A,n).concat([styrkeNote,"Beinpress: setet tilbakelent, dybde der bukveggen er rolig"]),"45 min")); }
  if(dow===3||dow===6){ s.title="Overkropp"; s.blocks.push(OPPV); s.blocks.push(ovkBlk(n)); if(k) s.blocks.push(k); }
  if(dow===4||dow===7){ s.title="Motbakke"; s.blocks.push(B("Motbakke",[`<span class="key">${i.lett?30:40} min</span> gange i oppoverbakke`,"Rolig tempo, kan snakke i hele setninger"])); }
  if(dow===5){

const urolig=e=>e&&(e.oppbluss||(typeof e.smerte==="number"&&e.smerte>3));
function roligeDager(){
  const ks=Object.keys(LOG).sort(); if(!ks.length) return null;
  let fra=null; for(const k of ks) if(urolig(LOG[k])) fra=k;
  return fra?dayDiff(cur,parseYmd(fra)):dayDiff(cur,parseYmd(ks[0]))+1;
}
function sittSiste7(){ let m=null; for(let k=0;k<7;k++){ const e=LOG[ymd(addDays(cur,-k))]; if(e&&typeof e.sitt==="number") m=Math.max(m||0,e.sitt); } return m; }
function statusNotes(){
  const out=[], r=roligeDager(), sm=sittSiste7(), t=TRINN[trinnNo()-1];
  const e0=LOG[ymd(cur)], e1=LOG[ymd(addDays(cur,-1))];

}

/* SVG: én måling over tid (siste 26 uker) */
function svgSeries(key,color,unit,fixedMax){
  const pts=Object.keys(LOG).sort().filter(k=>typeof LOG[k][key]==="number"&&dayDiff(cur,parseYmd(k))<=182).map(k=>({k,v:LOG[k][key]}));
  if(pts.length<2) return `<p class="muted small" style="margin:0">Grafen kommer når minst to dager er logget.</p>`;
  const W=320,H=130,L=30,R=8,T=8,Bm=20, d0=parseYmd(pts[0].k), span=Math.max(1,dayDiff(parseYmd(pts[pts.length-1].k),d0));
  const mx=fixedMax||Math.max(10,Math.ceil(Math.max(...pts.map(p=>p.v))/10)*10);
  const X=p=>L+(W-L-R)*dayDiff(parseYmd(p.k),d0)/span, Y=p=>T+(H-T-Bm)*(1-p.v/mx);
  const path=pts.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p).toFixed(1)).join(" ");
  const grid=[0,.5,1].map(f=>{ const y=T+(H-T-Bm)*(1-f); return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="currentColor" stroke-opacity=".15"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">${Math.round(mx*f)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Utvikling over tid" style="width:100%;height:auto;display:block">${grid}
  <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="2.5" fill="${color}"/>`).join("")}
  <text x="${L}" y="${H-5}" font-size="10" fill="currentColor" opacity=".6">${fmt(d0)}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">${fmt(parseYmd(pts[pts.length-1].k))}${unit?" · "+unit:""}</text></svg>`;
}

function downloadBackup(){
  const blob=new Blob([JSON.stringify({utover:NAVN,versjon:1,innst:SET,logg:LOG},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=KEY+"-logg-"+ymd(cur)+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function restoreBackup(file){
  const r=new FileReader();
  r.onload=()=>{ let msg; try{ const o=JSON.parse(r.result); const l=o&&o.logg; if(!l||typeof l!=="object") throw 0;
      let n=0; for(const k in l){ if(/^\d{4}-\d\d-\d\d$/.test(k)&&!LOG[k]){ LOG[k]=l[k]; n++; } }
      saveLog(); render(); msg=`Hentet inn ${n} dager.`; }
    catch(e){ msg="Fant ingen logg i filen."; }
    const m=document.getElementById("shareMsg"); if(m) m.textContent=msg; };
  r.readAsText(file);
}

  if(el.dataset.wk){ weekRef=addDays(weekRef,+el.dataset.wk); render(); return; }
  if(el.dataset.wkreset){ ev.preventDefault(); weekRef=new Date(cur); render(); return; }
  if(el.dataset.go){ ev.preventDefault(); selDate=parseYmd(el.dataset.go); if(location.hash!=="#idag") location.hash="#idag"; else { render(); window.scrollTo(0,0); } return; }
  if(el.dataset.anchor){ ev.preventDefault(); const go=()=>{ const t=document.getElementById(el.dataset.anchor); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); };
    const tab=el.getAttribute("href")||"#idag"; if(location.hash!==tab){ location.hash=tab; setTimeout(go,150); } else go(); return; }
  if(el.dataset.frekv){ SET.frekv=+el.dataset.frekv; SET.frekvFra=ymd(cur); saveSet(); render(); return; }
  if(el.dataset.trinn){ SET.trinn=+el.dataset.trinn; saveSet(); render(); return; }
  if(el.dataset.sitt){ SET.sitt=Math.min(120,Math.max(5,SET.sitt+(+el.dataset.sitt))); saveSet(); render(); return; }
  if(el.dataset.backup){ downloadBackup(); return; }
  if(el.id==="startSave"){ const v=(document.getElementById("startDato").value||"").trim(), m=document.getElementById("startMsg");
    if(!/^\d{4}-\d\d-\d\d$/.test(v)||isNaN(parseYmd(v))){ m.textContent="Skriv datoen som ÅÅÅÅ-MM-DD."; return; }
    SET.start=ymd(monday(parseYmd(v))); saveSet(); render(); document.getElementById("startMsg").textContent="Lagret."; return; }
  if(el.id==="fSave"){
    const s=session(selDate), k=ymd(selDate);
    const e={dato:k,okt:s.title,trinn:SET.trinn,mikro:document.getElementById("fMi").checked,oktGjort:document.getElementById("fOk").checked,
      oppbluss:document.getElementById("fOp").checked,kommentar:(document.getElementById("fKom").value||"").trim(),lagret:new Date().toISOString()};
    const sm=num("fSm",0,10), si=num("fSi",0,600); if(sm!=null) e.smerte=sm; if(si!=null) e.sitt=si;
    LOG[k]=e; saveLog(); render(); const m=document.getElementById("fMsg"); if(m) m.textContent="Lagret."; return;
  }
  if(el.id==="fDel"){ delete LOG[ymd(selDate)]; saveLog(); render(); return; }
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="restoreFile"&&ev.target.files[0]) restoreBackup(ev.target.files[0]);
  if(ev.target.id==="beinB"){ SET.beinB=ev.target.checked; SET.beinBfra=SET.beinB?ymd(cur):""; saveSet(); render(); }
});
loadLocal();
document.getElementById("syncState").textContent="Logg på denne telefonen";
render();

/* ============ OPPDATERING ============ */
const APP_VERSION="2026-11-14-170326";
function verLabel(v){ const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(v); return m?`Planversjon ${+m[3]}. ${MON[+m[2]-1]} ${m[1]}`:""; }
async function checkUpdate(){
  if(APP_VERSION.startsWith("__")) return;
  try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
    const j=await r.json(); const v=j&&j[KEY]; if(!v||!v.versjon||v.versjon===APP_VERSION) return;
    document.getElementById("updTxt").textContent="Ny versjon av planen."+(v.melding?" "+v.melding:"");
    document.getElementById("upd").hidden=false; }catch(e){}
}
document.getElementById("ver").textContent=verLabel(APP_VERSION);
document.getElementById("updBtn").addEventListener("click",()=>location.reload());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
setInterval(checkUpdate,30*60*1000);
checkUpdate();

</script>
